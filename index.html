<body>
<main id="app"></main>
<script>
"use strict";
/* ===== Konfigurasi ===== */
const API_URL = "https://script.google.com/macros/s/AKfycby7hXngXJgR5IOajI-nUy-s-fd6IbnGR1YY9tro_Gb0w-rieewaOF37OLoKUpgYdiY/exec";
const KKM = 75;
const API_TIMEOUT_MS = 25000;
const REFRESH_COOLDOWN_S = 30;
const URL_REVOKE_DELAY_MS = 60000;
const SESSION_KEY = "rn_session", DATA_KEY = "rn_data";
const LABELS = { INFORMATIKA: "Informatika" };
const BINS = [[0, "0–49"], [50, "50–59"], [60, "60–69"], [70, "70–79"], [80, "80–89"], [90, "90–100"]];

/* ===== Util ===== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label = m => LABELS[m] || m;
const fmt = n => n == null ? "–" : (Math.round(n * 10) / 10).toLocaleString("id-ID");
const natural = (a, b) => a.localeCompare(b, "id", { numeric: true });
const store = {
  get: k => { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* penyimpanan penuh/ditolak: abaikan */ } },
  del: k => { try { sessionStorage.removeItem(k); } catch { /* abaikan */ } },
};

/* ===== API ===== */
async function api(payload) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), API_TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload), signal: ctl.signal });
    const json = await res.json();
    if (!json.ok) throw Object.assign(new Error(json.message), { code: json.code });
    return json;
  } catch (e) {
    if (e.code) throw e;
    throw Object.assign(new Error(e.name === "AbortError" ? "Server terlalu lama merespons. Coba lagi." : "Tidak dapat terhubung. Periksa koneksi internet."), { code: "NETWORK" });
  } finally { clearTimeout(timer); }
}

/* ===== Statistik (fungsi murni) ===== */
const valid = v => typeof v === "number" && Number.isFinite(v);
const avg = xs => { const v = xs.filter(valid); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const tingkat = k => String(k).split(".")[0];
function summary(d) {
  const all = d.siswa.flatMap(s => s.nilai).filter(valid);
  return { siswa: d.siswa.length, kelas: new Set(d.siswa.map(s => s.kelas)).size, rata: avg(all), tuntas: all.length ? all.filter(v => v >= KKM).length / all.length * 100 : null };
}
const avgByMapel = d => d.mapel.map((m, i) => ({ id: i, label: label(m), value: avg(d.siswa.map(s => s.nilai[i])) })).sort((a, b) => a.value == null && b.value == null ? 0 : a.value == null ? 1 : b.value == null ? -1 : a.value - b.value);
function avgByKelas(d, t) {
  const g = {};
  d.siswa.filter(s => !t || tingkat(s.kelas) === t).forEach(s => (g[s.kelas] ??= []).push(avg(s.nilai)));
  return Object.keys(g).sort(natural).map(k => ({ label: "Kelas " + k, value: avg(g[k]) }));
}
const distribution = d => {
  const all = d.siswa.flatMap(s => s.nilai).filter(valid);
  return BINS.map(([from, text], i) => {
    const to = i + 1 < BINS.length ? BINS[i + 1][0] : Infinity;
    return { label: text, value: all.filter(v => v >= from && v < to).length };
  });
};
function kelengkapan(d) {
  if (!d || !d.siswa || !d.siswa.length || !d.mapel || !d.mapel.length) {
    return { total: 0, terisi: 0, kosong: 0, pct: null, mapelKosong: [] };
  }
  const islamIdxs = [];
  const kristenIdxs = [];
  const relIdxs = [];
  d.mapel.forEach((m, idx) => {
    const lbl = label(m);
    if (/islam|pai\b|paibp/i.test(lbl)) islamIdxs.push(idx);
    if (/kristen|katolik|pak\b|pakbp/i.test(lbl)) kristenIdxs.push(idx);
    if (/agama|kepercayaan/i.test(lbl)) relIdxs.push(idx);
  });

  const isWajib = (s, j) => {
    if (valid(s.nilai[j])) return true;
    if (kristenIdxs.includes(j)) {
      if (islamIdxs.some(k => valid(s.nilai[k]))) return false;
    }
    if (islamIdxs.includes(j)) {
      if (kristenIdxs.some(k => valid(s.nilai[k]))) return false;
    }
    if (relIdxs.includes(j)) {
      if (relIdxs.some(k => k !== j && valid(s.nilai[k]))) return false;
    }
    return true;
  };

  let total = 0;
  let terisi = 0;
  const missingCounts = new Uint32Array(d.mapel.length);

  for (let i = 0; i < d.siswa.length; i++) {
    const s = d.siswa[i];
    const vals = s.nilai;
    for (let j = 0; j < d.mapel.length; j++) {
      if (isWajib(s, j)) {
        total++;
        if (valid(vals[j])) {
          terisi++;
        } else {
          missingCounts[j]++;
        }
      }
    }
  }

  const kosong = total - terisi;
  const pct = total > 0 ? (terisi / total * 100) : null;
  const mapelKosong = d.mapel.map((m, j) => ({
    label: label(m),
    count: missingCounts[j]
  })).filter(m => m.count > 0).sort((a, b) => b.count - a.count);

  return { total, terisi, kosong, pct, mapelKosong };
}

/* ===== Ekspor .xlsx (tanpa library) ===== */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files) {
  const te = new TextEncoder(), parts = [], cen = []; let off = 0;
  for (const [name, text] of files) {
    const nb = te.encode(name), d = te.encode(text), c = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, d);
    const k = new DataView(new ArrayBuffer(46));
    k.setUint32(0, 0x02014b50, true); k.setUint16(4, 20, true); k.setUint16(6, 20, true); k.setUint16(8, 0x800, true); k.setUint16(14, 0x21, true);
    k.setUint32(16, c, true); k.setUint32(20, d.length, true); k.setUint32(24, d.length, true); k.setUint16(28, nb.length, true); k.setUint32(42, off, true);
    cen.push(new Uint8Array(k.buffer), nb); off += 30 + nb.length + d.length;
  }
  const size = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
const colName = i => (i >= 26 ? colName(Math.floor(i / 26) - 1) : "") + String.fromCharCode(65 + i % 26);
function downloadXlsx(rows, fileName) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const sheet = rows.map((r, i) => `<row r="${i + 1}">` + r.map((v, j) => {
    const ref = colName(j) + (i + 1);
    if (v == null || v === "") return "";
    return valid(v) ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t>${x(v)}</t></is></c>`;
  }).join("") + "</row>").join("");
  const ns = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"', head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const blob = zipStore([
    ["[Content_Types].xml", `${head}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`],
    ["_rels/.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `${head}<workbook ${ns} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Nilai" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml", `${head}<worksheet ${ns}><sheetData>${sheet}</sheetData></worksheet>`],
  ]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.hidden = true;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), URL_REVOKE_DELAY_MS);
}

function insights(d) {
  if (!d || !d.siswa || !d.siswa.length || !d.mapel || !d.mapel.length) {
    return [{ type: "info", text: "Belum ada data nilai yang cukup untuk dianalisis." }];
  }
  const kl = kelengkapan(d);
  if (!kl.terisi) {
    return [{ type: "info", text: "Belum ada nilai yang dimasukkan ke spreadsheet." }];
  }

  const mapelAvgs = d.mapel.map((m, i) => {
    const scores = d.siswa.map(s => s.nilai[i]).filter(valid);
    return { id: i, label: label(m), avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null };
  }).filter(m => m.avg !== null);

  const kList = kelasList(d);
  const kelasAvgs = kList.map(k => {
    const scores = d.siswa.filter(s => s.kelas === k).flatMap(s => s.nilai).filter(valid);
    return { kelas: k, avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null };
  }).filter(k => k.avg !== null);

  const belowMapel = mapelAvgs.filter(m => m.avg < KKM);
  const sortedMapel = [...mapelAvgs].sort((a, b) => a.avg - b.avg);
  const sortedKelas = [...kelasAvgs].sort((a, b) => a.avg - b.avg);
  const res = [];

  // 1. Peringatan kelengkapan pengisian nilai bila ada nilai kosong
  if (kl.kosong > 0 && kl.mapelKosong.length > 0) {
    res.push({
      type: "warn",
      text: `${kl.kosong} nilai belum diinput (${kl.mapelKosong[0].label} terbanyak: ${kl.mapelKosong[0].count} siswa belum dinilai).`
    });
  }

  // 2. Mapel dengan rata-rata terendah di bawah KKM
  if (sortedMapel.length && sortedMapel[0].avg < KKM) {
    res.push({
      type: "warn",
      text: `Mata pelajaran ${sortedMapel[0].label} memiliki rata-rata terendah (${fmt(sortedMapel[0].avg)}), di bawah KKM ${KKM}.`
    });
  }

  // 3. Jumlah mapel di bawah KKM bila > 1
  if (belowMapel.length > 1 && res.length < 3) {
    res.push({
      type: "warn",
      text: `Terdapat ${belowMapel.length} dari ${mapelAvgs.length} mata pelajaran dengan rata-rata di bawah KKM ${KKM}.`
    });
  } else if (belowMapel.length === 1 && !res.some(r => r.text.includes(belowMapel[0].label)) && res.length < 3) {
    res.push({
      type: "warn",
      text: `Mata pelajaran ${belowMapel[0].label} adalah satu-satunya mapel di bawah KKM (${fmt(belowMapel[0].avg)}).`
    });
  }

  // 4. Kelas dengan rata-rata terendah
  if (sortedKelas.length && res.length < 3) {
    const lowestK = sortedKelas[0];
    if (lowestK.avg < KKM) {
      res.push({
        type: "warn",
        text: `Kelas ${lowestK.kelas} perlu perhatian khusus dengan rata-rata ${fmt(lowestK.avg)} (di bawah KKM ${KKM}).`
      });
    } else if (res.length < 2 && sortedKelas.length > 1) {
      res.push({
        type: "info",
        text: `Kelas dengan rata-rata terendah saat ini adalah Kelas ${lowestK.kelas} (${fmt(lowestK.avg)}).`
      });
    }
  }

  if (res.length === 0) {
    res.push({
      type: "good",
      text: `Seluruh data nilai lengkap (100%) dan seluruh mata pelajaran telah mencapai atau melampaui KKM ${KKM}.`
    });
  }

  return res.slice(0, 3);
}

function matrixAgg(d, tg) {
  const ks = kelasList(d).filter(k => !tg || tingkat(k) === tg);
  const kIndex = {};
  for (let i = 0; i < ks.length; i++) kIndex[ks[i]] = i;
  const nMapel = d.mapel.length;
  const sums = Array.from({ length: ks.length }, () => new Float64Array(nMapel));
  const counts = Array.from({ length: ks.length }, () => new Uint16Array(nMapel));

  for (let i = 0; i < d.siswa.length; i++) {
    const s = d.siswa[i];
    const r = kIndex[s.kelas];
    if (r === undefined) continue;
    const vals = s.nilai;
    for (let j = 0; j < nMapel; j++) {
      const v = vals[j];
      if (typeof v === "number" && Number.isFinite(v)) {
        sums[r][j] += v;
        counts[r][j]++;
      }
    }
  }

  return ks.map((k, r) => ({
    kelas: k,
    mapelAvgs: Array.from({ length: nMapel }, (_, c) => counts[r][c] > 0 ? sums[r][c] / counts[r][c] : null)
  }));
}

function heatLevel(v) {
  if (v == null) return 0;
  if (v < 65) return 1;
  if (v < 75) return 2;
  if (v < 80) return 3;
  if (v < 88) return 4;
  return 5;
}

function heatCell(v) {
  if (v == null) return `<td class="dash-heat-cell heat-none" title="Belum ada data nilai diinput" aria-label="Belum ada data">–</td>`;
  const lvl = heatLevel(v);
  const isLow = v < KKM;
  const content = isLow ? `<span class="dash-low-marker" aria-hidden="true">▼</span>${fmt(v)}` : fmt(v);
  const title = `${isLow ? 'Di bawah KKM: ' : ''}${fmt(v)}`;
  const aria = `${fmt(v)}${isLow ? ', di bawah KKM' : ''}`;
  return `<td class="dash-heat-cell heat-${lvl}${isLow ? ' heat-low' : ''}" title="${esc(title)}" aria-label="${esc(aria)}">${content}</td>`;
}

function vhist(items) {
  const total = items.reduce((a, b) => a + b.value, 0);
  const max = Math.max(1, ...items.map(i => i.value));
  return `<figure class="dash-vhist-fig" role="group" aria-label="Grafik sebaran nilai">
    <figcaption class="sr-only">Sebaran nilai siswa: ${items.map(i => `${i.label} ada ${i.value} nilai (${total ? Math.round(i.value / total * 100) : 0}%)`).join(", ")}</figcaption>
    <div class="dash-vhist" aria-hidden="true">
      ${items.map(i => {
        const pct = total ? (i.value / total * 100) : 0;

        return `<div class="dash-vhist-col">

}

        <span class="dash-legend-item"><span class="dash-legend-swatch heat-low-sample">▼</span> &lt; KKM ${KKM}</span>
      </div>
    ` : `<div class="empty">Tidak ada kelas yang cocok dengan filter.</div>`}
  </section>

  <!-- 4. Rata-rata per Mapel & 5. Sebaran Nilai -->
  <div class="grid two" style="margin-top:var(--s3)">
    <section class="card">
      <h3>Rata-rata per mata pelajaran</h3>
      <p class="muted">Urut dari terendah ke tertinggi. Garis tegak = KKM ${KKM}</p>
      ${bars(avgByMapel(d))}
    </section>
    <section class="card">
      <h3>Sebaran nilai</h3>
      <p class="muted">Jumlah dan persentase nilai per rentang</p>
      ${vhist(distribution(d))}
    </section>
  </div>

  <p style="margin-top:var(--s3)"><button data-act="export-all">Unduh semua nilai (.xlsx)</button></p>`;
}
function kelasRows() {
  const d = S.data, q = S.q.trim().toLowerCase();
  return d.siswa.filter(s => s.kelas === S.kelas && (!q || s.nama.toLowerCase().includes(q) || s.no_urut.includes(q)));
}
function viewKelas() {
  const d = S.data, rows = kelasRows();
  return `<div class="row"><div><label for="kelas">Kelas</label><select id="kelas">${options(kelasList(d).map(k => [k, "Kelas " + k]), S.kelas)}</select></div>
    <div><label for="q">Cari siswa</label><input id="q" type="search" value="${esc(S.q)}" placeholder="Nama atau nomor"></div>
    <button data-act="export-kelas">Unduh .xlsx</button></div>
  ${rows.length ? `<p class="muted scroll-hint" style="font-size:0.75rem; margin-bottom:var(--s1)">&larr; Geser tabel ke kanan untuk melihat seluruh mapel &rarr;</p>
  <div class="tw"><table>${chunkHead(d.mapel.map(label).concat("Rata-rata"))}<tbody>${rows.map(s => `<tr><td>${esc(s.no_urut)}</td><td scope="row" title="${esc(s.nama)}">${esc(s.nama)}</td>${s.nilai.map(v => `<td>${cell(v)}</td>`).join("")}<td><b>${cell(avg(s.nilai))}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td></td><td>Rata-rata kelas</td>${d.mapel.map((_, i) => `<td>${fmt(avg(rows.map(s => s.nilai[i])))}</td>`).join("")}<td>${fmt(avg(rows.map(s => avg(s.nilai))))}</td></tr></tfoot></table></div>` : `<div class="card empty">Tidak ada siswa yang cocok.</div>`}`;
}
function mapelRows() {
  const i = S.mapel;
  return S.data.siswa.filter(s => !S.mapelKelas || s.kelas === S.mapelKelas).filter(s => valid(s.nilai[i])).sort((a, b) => b.nilai[i] - a.nilai[i]);
}
function viewMapel() {
  const d = S.data, i = S.mapel, rows = mapelRows(), perKelas = {};
  d.siswa.forEach(s => (perKelas[s.kelas] ??= []).push(s.nilai[i]));
  const ranking = Object.keys(perKelas).sort(natural).map(k => ({ label: "Kelas " + k, value: avg(perKelas[k]) })).sort((a, b) => (b.value ?? -1) - (a.value ?? -1));
  const vals = rows.map(s => s.nilai[i]), below = vals.filter(v => v < KKM).length;
  return `<div class="row"><div><label for="mapel">Mata pelajaran</label><select id="mapel">${options(d.mapel.map((m, k) => [k, label(m)]), i)}</select></div>
    <div><label for="mk">Kelas</label><select id="mk">${options(kelasList(d).map(k => [k, "Kelas " + k]), S.mapelKelas, "Semua kelas")}</select></div>
    <button data-act="export-mapel">Unduh .xlsx</button></div>
  <div class="grid stats" style="margin-bottom:var(--s3)">${[["Rata-rata", fmt(avg(vals))], ["Tertinggi", vals.length ? fmt(Math.max(...vals)) : "–"], ["Terendah", vals.length ? fmt(Math.min(...vals)) : "–"], [`Di bawah KKM`, below]].map(([t, v]) => `<div class="card stat"><span class="muted">${t}</span><b>${v}</b></div>`).join("")}</div>
  <div class="grid two"><section class="card mapel-ranking"><h3>Peringkat rata-rata kelas</h3>${bars(ranking)}</section>
  <section class="card mapel-students" style="padding:0;overflow:hidden">${rows.length ? `<div class="tw" style="border:0"><table><thead><tr><th scope="col">#</th><th scope="col">Nama</th><th scope="col">Kelas</th><th scope="col">Nilai</th></tr></thead><tbody>${rows.map((s, n) => `<tr><td>${n + 1}</td><td scope="row" title="${esc(s.nama)}">${esc(s.nama)}</td><td>${esc(s.kelas)}</td><td>${cell(s.nilai[i])}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Belum ada nilai untuk pilihan ini.</div>`}</section></div>`;
}
const VIEWS = { dashboard: ["Dashboard", viewDashboard], kelas: ["Nilai per kelas", viewKelas], mapel: ["Nilai per mapel", viewMapel] };

function viewApp() {
  const body = S.loading && !S.data ? `<div class="grid stats"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>` : S.data ? (S.data.siswa.length ? VIEWS[S.view][1]() : `<div class="card empty">Belum ada data siswa di spreadsheet.</div>`) : "";
  return `<header class="top"><div class="wrap"><h1 style="font-size:1.125rem; font-weight:700; margin:0">Rekap Nilai</h1>
    <nav class="bottom-nav" aria-label="Menu utama">${Object.entries(VIEWS).map(([k, [t]]) => `<button data-view="${k}"${k === S.view ? ' aria-current="page"' : ""}>${t}</button>`).join("")}</nav>
    <div style="display:flex;gap:var(--s2)"><button data-act="refresh"${S.loading || S.cooldown ? " disabled" : ""}>${S.loading ? "Memuat…" : S.cooldown ? `Segarkan (${S.cooldown})` : "Segarkan"}</button><button class="subtle" data-act="logout">Keluar</button></div></div></header>
  <div class="wrap" aria-busy="${S.loading}">${S.error ? `<div class="banner" role="alert"><span>${esc(S.error)}</span><button data-act="retry">Coba lagi</button></div>` : ""}${body}</div>`;
}

/* ===== Render ===== */
function render() {
  const keep = document.activeElement && document.activeElement.id;
  const pos = document.activeElement && document.activeElement.selectionStart;
  $("#app").innerHTML = S.sess ? viewApp() : viewLogin();
  const el = keep && document.getElementById(keep);
  if (el) { el.focus(); if (pos != null && el.setSelectionRange && el.type === "search") el.setSelectionRange(pos, pos); }
}

/* ===== Aksi ===== */
function logout(msg = "") {
  S.sess = null; S.data = null; S.setupToken = ""; S.error = msg;
  store.del(SESSION_KEY); store.del(DATA_KEY); render();
}
function startSession(r) {
  S.sess = { token: r.token, nama: r.guru.nama, exp: r.expiresAt }; store.set(SESSION_KEY, S.sess);
  S.setupToken = ""; S.error = ""; loadData(false);
}
async function loadData(force) {
  if (!S.sess) return;
  const cached = store.get(DATA_KEY);
  if (cached && !S.data) { S.data = cached.data; initSelections(); }
  S.loading = true; S.error = ""; render();
  try {
    const r = await api({ action: "data", token: S.sess.token, since: cached ? cached.version : "", force });
    if (r.unchanged) { if (!S.data && cached) S.data = cached.data; }
    else { S.data = { mapel: r.mapel, siswa: r.siswa }; store.set(DATA_KEY, { version: r.version, data: S.data }); }
    initSelections();
  } catch (e) {
    if (e.code === "SESSION_EXPIRED") return logout(e.message);
    S.error = e.message + (S.data ? " Menampilkan data terakhir." : "");
  } finally { S.loading = false; render(); }
}
function initSelections() {
  const ks = kelasList(S.data);
  if (!ks.includes(S.kelas)) S.kelas = ks[0] || "";
  if (S.mapel >= S.data.mapel.length) S.mapel = 0;
}
function startCooldown() {
  S.cooldown = REFRESH_COOLDOWN_S;
  const t = setInterval(() => { S.cooldown--; if (S.cooldown <= 0) clearInterval(t); render(); }, 1000);
}
function exportRows(kind) {
  const d = S.data, head = ["Kelas", "No", "Nama", ...d.mapel.map(label)];
  if (kind === "kelas") return [["No", "Nama", ...d.mapel.map(label), "Rata-rata"], ...kelasRows().map(s => [s.no_urut, s.nama, ...s.nilai, avg(s.nilai)])];
  if (kind === "mapel") return [["No", "Nama", "Kelas", label(d.mapel[S.mapel])], ...mapelRows().map((s, n) => [n + 1, s.nama, s.kelas, s.nilai[S.mapel]])];
  return [head, ...d.siswa.map(s => [s.kelas, s.no_urut, s.nama, ...s.nilai])];
}
const safeName = t => t.replace(/[^\w.-]+/g, "_");

/* ===== Event ===== */
document.addEventListener("submit", async e => {
  if (e.target.id !== "f-login") return;
  e.preventDefault();
  const btn = e.target.querySelector("button"), v = id => (document.getElementById(id)?.value || "").trim();
  S.error = "";
  try {
    if (S.setupToken) {
      if (!/^\d{6}$/.test(v("pin"))) throw new Error("PIN harus terdiri dari 6 angka.");
      if (v("pin") !== v("pin2")) throw new Error("Kedua PIN tidak sama.");
    } else if (!/^\d{8,20}$/.test(v("nip").replace(/\s+/g, "")) || !v("secret")) throw new Error("Isi NIP (angka) dan PIN/kode aktivasi.");
    btn.disabled = true; btn.textContent = "Memproses…";
    const r = S.setupToken ? await api({ action: "setPin", setupToken: S.setupToken, pin: v("pin") })
                           : await api({ action: "login", nip: v("nip").replace(/\s+/g, ""), secret: v("secret") });
    if (r.needsPin) { S.setupToken = r.setupToken; S.nama = r.nama; render(); $("#pin").focus(); return; }
    startSession(r);
  } catch (err) {
    if (err.code === "SESSION_EXPIRED") S.setupToken = "";
    S.error = err.message; render();
  }
});
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]"), a = e.target.closest("[data-act]");
  if (v) { S.view = v.dataset.view; render(); return; }
  if (!a) return;
  const act = a.dataset.act, d = S.data;
  if (act === "nav-kelas") {
    S.view = "kelas";
    S.kelas = a.dataset.kelas;
    render();
  }
  else if (act === "nav-mapel") {
    S.view = "mapel";
    S.mapel = Number(a.dataset.mapel);
    S.mapelKelas = "";
    render();
  }
  else if (act === "logout") {
    if (window.confirm("Apakah Anda yakin ingin keluar dari aplikasi?")) logout();
  }
  else if (act === "retry") loadData(false);
  else if (act === "refresh") { startCooldown(); loadData(true); }
  else if (d && act.startsWith("export-")) {
    const kind = act.slice(7), name = kind === "kelas" ? "Kelas_" + S.kelas : kind === "mapel" ? label(d.mapel[S.mapel]) : "Semua_Nilai";
    downloadXlsx(exportRows(kind), safeName("Nilai_" + name) + ".xlsx");
  }
});
document.addEventListener("change", e => {
  const m = { kelas: v => S.kelas = v, mapel: v => S.mapel = Number(v), mk: v => S.mapelKelas = v, tg: v => S.tg = v }[e.target.id];
  if (m) { m(e.target.value); render(); }
});
let searchTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      S.q = e.target.value;
      const d = S.data;
      if (!d) return;
      const rows = kelasRows();
      const tbody = document.querySelector(".tw tbody");
      const tfoot = document.querySelector(".tw tfoot");
      if (tbody && rows.length) {
        tbody.innerHTML = rows.map(s => `<tr><td>${esc(s.no_urut)}</td><td scope="row" title="${esc(s.nama)}">${esc(s.nama)}</td>${s.nilai.map(v => `<td>${cell(v)}</td>`).join("")}<td><b>${cell(avg(s.nilai))}</b></td></tr>`).join("");
        if (tfoot) tfoot.innerHTML = `<tr><td></td><td>Rata-rata kelas</td>${d.mapel.map((_, i) => `<td>${fmt(avg(rows.map(s => s.nilai[i])))}</td>`).join("")}<td>${fmt(avg(rows.map(s => avg(s.nilai))))}</td></tr>`;
      } else {
        render();
      }
    }, 150);
  }
});

/* ===== Mulai ===== */
if (S.sess && S.sess.exp > Date.now()) loadData(false); else { store.del(SESSION_KEY); store.del(DATA_KEY); S.sess = null; render(); }
</script>
</body>
</html>
