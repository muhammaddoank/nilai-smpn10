<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekap Nilai – SMPN 10 Depok</title>
<meta name="theme-color" content="#12355b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== 1. TOKEN ===== */
:root {
  color-scheme: light dark;

  /* Merek & Aksen */
  --brand: #12355b;                 /* navy: judul/header */
  --accent: #0f766e;                /* teal: aksi utama & tuntas */
  --accent-hover: #115e59;
  --accent-soft: #e6f4f1;
  --accent-fg: #ffffff;

  /* Permukaan & Teks */
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --text: #0f172a;
  --text-muted: #64748b;
  --muted: var(--text-muted);
  --line-subtle: #e2e8f0;
  --line: var(--line-subtle);
  --row-hover: #f1f5f9;

  /* Border Kontrol (WCAG >= 3:1) */
  --border-control: #718096;
  --border-control-hover: #475569;

  /* Status Kritis / Error */
  --bad: #be123c;
  --bad-bg: #fff1f2;

  /* Semantik Dashboard */
  --dash-emerald: #0f766e;
  --dash-emerald-bg: #e6f4f1;
  --dash-emerald-fg: #0f5f58;

  --dash-amber: #f59e0b;
  --dash-amber-bg: #fffbeb;
  --dash-amber-fg: #b45309;

  --dash-indigo: #0f766e;
  --dash-indigo-bg: #e6f4f1;

  --dash-rose: #f43f5e;
  --dash-rose-bg: #fff1f2;
  --dash-rose-fg: #be123c;

  --dash-surface-2: #f8fafc;
  --dash-line: #e2e8f0;

  /* Heatmap Steps (Kontras Tinggi) */
  --heat-1: #e8f0ff;
  --heat-2: #c7dbfc;
  --heat-3: #9bbdf8;
  --heat-4: #6e9cf3;
  --heat-5: #3d6fe0;

  /* Spacing */
  --s1: 4px;
  --s1-5: 6px;
  --s2: 8px;
  --s2-5: 12px;
  --s3: 16px;
  --s4: 24px;
  --s5: 32px;
  --s6: 48px;

  /* Radius */
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 9999px;
  --r: var(--r-md);

  /* Shadows */
  --shadow-card: 0 1px 2px 0 rgba(15,23,42,.04), 0 1px 3px 0 rgba(15,23,42,.06);
  --shadow-card-hover: 0 4px 10px -2px rgba(15,23,42,.08), 0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-sticky: 2px 0 4px -2px rgba(0,0,0,.12);

  /* Transisi */
  --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-normal: 220ms cubic-bezier(0.4, 0, 0.2, 1);
  --t: var(--t-fast);

  /* Tipografi */
  --font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: 700 1.5rem/1.25 var(--font-family);
  --font-h1: 600 1.25rem/1.3 var(--font-family);
  --font-h2: 600 1rem/1.35 var(--font-family);
  --font-body: 400 0.9375rem/1.5 var(--font-family);
  --font-caption: 400 0.8125rem/1.45 var(--font-family);
  --font-micro: 500 0.75rem/1.35 var(--font-family);
}

@media (prefers-color-scheme: dark) {
  :root {
    --brand: #cfe0f5;
    --accent: #2dd4bf;
    --accent-hover: #5eead4;
    --accent-soft: #12302d;
    --accent-fg: #04201d;

    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #1f2026;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --line-subtle: #27272a;
    --row-hover: #1c1d23;

    --border-control: #71717a;
    --border-control-hover: #a1a1aa;

    --bad: #f87171;
    --bad-bg: #2a1215;

    --dash-emerald: #2dd4bf;
    --dash-emerald-bg: #0f2a27;
    --dash-emerald-fg: #5eead4;

    --dash-amber: #fbbf24;
    --dash-amber-bg: #2a1f0b;
    --dash-amber-fg: #fcd34d;

    --dash-indigo: #2dd4bf;
    --dash-indigo-bg: #0f2a27;

    --dash-rose: #fb7185;
    --dash-rose-bg: #2a1018;
    --dash-rose-fg: #fda4af;

    --dash-surface-2: #1c1d23;
    --dash-line: #2a2b31;

    --heat-1: #1a2333;
    --heat-2: #213153;
    --heat-3: #2c4172;
    --heat-4: #3e5a9a;
    --heat-5: #4c6bb7;

    --shadow-card: 0 1px 2px 0 rgba(0,0,0,.35), 0 1px 3px 0 rgba(0,0,0,.25);
    --shadow-card-hover: 0 4px 10px -2px rgba(0,0,0,.5);
    --shadow-sticky: 2px 0 4px -2px rgba(0,0,0,.25);
  }
}

/* ===== 2. RESET & BASE ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: var(--font-body);
  background: var(--bg);
  color: var(--text);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-family: var(--font-family); letter-spacing: -0.015em; }
header h1 { color: var(--brand); font-size: 1.25rem; font-weight: 600; }
h2 { font: var(--font-h1); }
h3 { font: var(--font-h2); }
.muted { color: var(--muted); font: var(--font-caption); }
.wrap { max-width: 72rem; margin: 0 auto; padding: var(--s3); }
header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header .wrap { display: flex; flex-wrap: wrap; gap: var(--s2-5); align-items: center; justify-content: space-between; padding-block: var(--s2); }

nav, nav.bottom-nav { display: flex; gap: var(--s1); overflow-x: auto; }
nav button, nav.bottom-nav button { border-color: transparent; background: none; color: inherit; }
nav button[aria-current=page], nav.bottom-nav button[aria-current=page] {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent);
  font-weight: 600;
}
nav button:hover, nav.bottom-nav button:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: transparent;
}
nav button[aria-current=page]:hover, nav.bottom-nav button[aria-current=page]:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.skip {
  position: absolute; left: -999px; top: 8px;
  background: var(--accent); color: var(--accent-fg);
  padding: 8px 12px; border-radius: var(--r-md);
  z-index: 200; text-decoration: none; font-weight: 600;
}
.skip:focus { left: 8px; }

/* ===== 3. KOMPONEN ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: var(--s3);
  transition: box-shadow 220ms ease, border-color 220ms ease;
}
.card h3 { font-size: 1.125rem; font-weight: 650; }
.card h3 + p, .card h3 + .muted { font-size: 0.8125rem; line-height: 1.5; }
@media (hover: hover) {
  .card:not(.stat-tile):hover { box-shadow: var(--shadow-card-hover); }
}

.grid { display: grid; gap: var(--s3); }
.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--s3); }

button, input, select {
  font: var(--font-body);
  color: inherit;
  min-height: 44px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-control);
  background: var(--surface);
  padding: 0 var(--s3);
}
/* iOS tidak zoom saat fokus */
input, select { width: 100%; font-size: max(16px, 1rem); }
button {
  cursor: pointer;
  transition: background var(--t-fast), opacity var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
button:hover:not(:disabled), input:hover, select:hover {
  border-color: var(--border-control-hover);
}
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
  font-weight: 600;
}
button.primary:hover:not(:disabled) {
  opacity: .9;
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
button.subtle { border-color: transparent; background: none; color: var(--muted); }
button.subtle:hover:not(:disabled) { background: var(--bg); color: var(--bad); border-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

label { display: block; font-weight: 500; margin-bottom: var(--s1); }
.field { margin-bottom: var(--s3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: end; margin-bottom: var(--s3); }
.row > * { flex: 1 1 11rem; }
.row > button { flex: 0 0 auto; }
.login { max-width: 24rem; margin: clamp(1.5rem, 6vh, 4rem) auto; border-radius: var(--r-lg); }
.err { color: var(--bad); margin: var(--s2) 0; min-height: 1.4em; }
.banner {
  border: 1px solid var(--bad); color: var(--bad); background: var(--bad-bg);
  border-radius: var(--r-md); padding: var(--s3); margin-bottom: var(--s3);
  display: flex; gap: var(--s3); justify-content: space-between; align-items: center;
  flex-wrap: wrap; transition: opacity var(--t-normal);
}

/* Tabel */
.tw {
  overflow: auto; max-height: 65vh;
  border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: inset -10px 0 8px -8px rgba(0,0,0,.15);
}
.scroll-hint { display: block; font: var(--font-micro); }
table {
  border-collapse: separate; border-spacing: 0;
  width: 100%; font: var(--font-caption); font-variant-numeric: tabular-nums;
}
th, td {
  padding: 10px 12px; border-bottom: 1px solid var(--line);
  white-space: nowrap; text-align: right; background: var(--surface);
  font-variant-numeric: tabular-nums;
}
th { position: sticky; top: 0; z-index: 2; font: var(--font-caption); font-weight: 600; }
th:first-child, td:first-child {
  position: sticky; left: 0; z-index: 2; width: 2.75rem; min-width: 2.75rem;
  text-align: center; background: var(--surface);
}
th:nth-child(2), td:nth-child(2) {
  position: sticky; left: 2.75rem; z-index: 2; min-width: 8rem; max-width: 9.5rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: left; background: var(--surface); border-right: 1px solid var(--line);
  box-shadow: var(--shadow-sticky);
}
th:first-child, th:nth-child(2) { z-index: 4; }
tbody th[scope=row] { top: auto; font-weight: 500; text-align: left; z-index: 2; }
tfoot td { font-weight: 600; position: sticky; bottom: 0; z-index: 2; background: var(--surface); }
tfoot td:first-child, tfoot td:nth-child(2) { z-index: 3; }

.tw > table:not(.dash-heat-tbl) tbody tr { transition: background var(--t-fast); }
.tw > table:not(.dash-heat-tbl) tbody tr:hover td,
.tw > table:not(.dash-heat-tbl) tbody tr:hover th,
.tw > table:not(.dash-heat-tbl) tbody tr:hover td:first-child,
.tw > table:not(.dash-heat-tbl) tbody tr:hover th:nth-child(2),
.tw > table:not(.dash-heat-tbl) tbody tr:hover td:nth-child(2) {
  background: var(--row-hover);
}

/* Bar / Meter */
.bar {
  display: grid; grid-template-columns: 8.5rem minmax(0, 1fr) 3.75rem;
  gap: var(--s2); align-items: center; margin: var(--s1) 0;
  font: var(--font-caption); font-variant-numeric: tabular-nums;
}
.bar:first-child { margin-top: 16px; }
.bar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.track {
  position: relative; height: 10px; background: var(--dash-surface-2);
  border-radius: var(--r-full); overflow: visible;
}
.fill {
  height: 100%; background: var(--accent);
  border-radius: var(--r-full); transition: width var(--t-normal);
}
.fill.low { background: var(--bad); }
.kkm {
  position: absolute; top: -3px; bottom: -3px; width: 2px;
  background: var(--text); opacity: .35; border-radius: 2px;
  z-index: 2; transition: opacity var(--t-fast);
}
@media (prefers-color-scheme: dark) {
  .kkm { background: #ffffff; opacity: .7; }
}
.bar .kkm::after {
  content: "KKM"; position: absolute; top: -18px; left: 50%;
  transform: translateX(-50%); font-size: 9px; font-weight: 700;
  letter-spacing: .05em; color: var(--text-muted);
}
.bar:not(:first-child) .kkm::after { display: none; }

/* Status Badges & Utilities */
.low {
  color: var(--bad); background: var(--bad-bg); padding: 2px 6px;
  border-radius: var(--r-sm); font-weight: 600; font-variant-numeric: tabular-nums;
}
.skel { height: 6rem; border-radius: var(--r-md); background: var(--line); animation: p 1.2s infinite alternate; }
@keyframes p { to { opacity: .4; } }
.empty { text-align: center; padding: var(--s4); color: var(--muted); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ===== 4. VIEW DASHBOARD ===== */
.dash-bento {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-auto-flow: dense;
  gap: var(--s3);
  margin-top: var(--s4);
  width: 100%;
}
.dash-bento > * { min-width: 0; }
.dash-bento > .ring-card { grid-column: span 3; }
.dash-bento > .stat-tile { grid-column: span 2; }
.dash-bento > .attention { grid-column: span 6; }
.dash-bento > .heatmap   { grid-column: span 6; }
.dash-bento > .barmapel  { grid-column: span 3; }
.dash-bento > .histogram { grid-column: span 3; }

/* Dual Ring */
.dash-ring-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: var(--s3) var(--s2);
  background: var(--surface);
}
.dash-ring-box {
  position: relative; width: 108px; height: 108px;
  display: flex; align-items: center; justify-content: center;
}
.dash-ring-svg { width: 108px; height: 108px; display: block; overflow: visible; }
.dash-ring-bar {
  stroke: var(--accent);
  transition: stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1);
}
@starting-style {
  .dash-ring-bar { stroke-dashoffset: 276.46; }
}
.dash-ring-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.dash-ring-pct {
  font-size: 1.625rem; font-weight: 700; line-height: 1.1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.dash-ring-sub {
  font-size: 0.75rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: .06em; margin-top: 2px;
}
.dash-ring-caption {
  margin-top: var(--s2); font-size: 0.75rem; color: var(--text-muted);
  text-align: center; font-variant-numeric: tabular-nums;
}

/* Stat Tiles */
.stat-tile { border-left: 0; padding: var(--s3); }
.stat-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
.stat-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
}
.stat-icon[data-tone="indigo"]  { background: var(--dash-indigo-bg); color: var(--dash-indigo); }
.stat-icon[data-tone="accent"]  { background: var(--accent-soft); color: var(--accent); }
.stat-icon[data-tone="emerald"] { background: var(--dash-emerald-bg); color: var(--dash-emerald); }
.stat-icon[data-tone="rose"]    { background: var(--dash-rose-bg); color: var(--dash-rose); }
.stat-tile b {
  display: block; font-size: 2.25rem; line-height: 1.05; font-weight: 700;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.muted.stat-label {
  font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
  font-weight: 600; color: var(--text-muted);
}
.stat-trend { font-size: .75rem; font-weight: 600; margin-top: 4px; }
.stat-trend.is-up { color: var(--dash-emerald-fg); }
.stat-trend.is-down { color: var(--dash-rose-fg); }

/* Perlu Perhatian */
.dash-attention { border-left: 0; padding: var(--s3); }
summary.dash-attention-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--s2-5); gap: var(--s2); flex-wrap: wrap;
  cursor: pointer; list-style: none; user-select: none;
}
summary.dash-attention-head::-webkit-details-marker { display: none; }
summary.dash-attention-head::after {
  content: "▾"; font-size: 0.875rem; color: var(--text-muted);
  transition: transform var(--t-fast);
}
details.dash-attention:not([open]) summary.dash-attention-head::after { transform: rotate(-90deg); }
details.dash-attention:not([open]) summary.dash-attention-head { margin-bottom: 0; }
.dash-attention-head h3::before {
  content: ""; display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--dash-amber);
  margin-right: 10px; vertical-align: middle;
}
.dash-attention-list {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; gap: var(--s2);
}
.dash-attention-item {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: var(--s3); padding: var(--s2-5) var(--s3); border-radius: var(--r-lg);
  border: 1px solid transparent; font: var(--font-body); line-height: 1.45;
}
button.dash-attention-item {
  width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; cursor: pointer;
}
.dash-attention-item.is-warn {
  background: color-mix(in srgb, var(--dash-amber-bg) 70%, var(--surface));
  border-color: color-mix(in srgb, var(--dash-amber) 30%, transparent);
}
.dash-attention-item.is-good {
  background: color-mix(in srgb, var(--dash-emerald-bg) 70%, var(--surface));
  border-color: color-mix(in srgb, var(--dash-emerald) 30%, transparent);
}
.dash-attention-item.is-info {
  background: color-mix(in srgb, var(--accent-soft) 70%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 25%, transparent);
}
.dash-att-marker {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; font-weight: 700;
}
.is-warn .dash-att-marker { background: var(--dash-amber); color: #fff; }
.is-good .dash-att-marker { background: var(--dash-emerald); color: #fff; }
.is-info .dash-att-marker { background: var(--accent); color: #fff; }
.dash-att-badge {
  font-size: .75rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; padding: 4px 8px; border-radius: var(--r-full);
  background: rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  .dash-att-badge { background: rgba(255,255,255,.08); color: var(--text); }
}
.dash-attention-item.is-clickable { cursor: pointer; transition: box-shadow .15s ease; }
.dash-attention-item.is-clickable:hover { box-shadow: var(--shadow-card); transform: none; }
.dash-attention-item.is-clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Heatmap */
.dash-heat-tw { max-height: 26rem; position: relative; }
.dash-heat-tbl { border-collapse: separate; border-spacing: 0; width: 100%; }
.dash-heat-tbl th, .dash-heat-tbl td {
  padding: 2px; text-align: center; font-variant-numeric: tabular-nums;
  border: 0;
}
.dash-heat-tbl th { position: sticky; top: 0; z-index: 3; background: var(--surface); font-weight: 600; }
.dash-th-corner {
  position: sticky; top: 0; left: 0; z-index: 6; background: var(--surface);
  min-width: 6rem; border-right: 1px solid var(--line); box-shadow: var(--shadow-sticky);
  padding: 0 var(--s2); text-align: left; vertical-align: middle; font-size: 0.8125rem;
}
.dash-th-kelas {
  position: sticky; left: 0; z-index: 4; background: var(--surface);
  min-width: 6rem; text-align: left; border-right: 1px solid var(--line);
  box-shadow: var(--shadow-sticky);
}
.dash-th-mapel { min-width: 5.5rem; }
.dash-heat-tbl th:nth-child(2), .dash-heat-tbl td:nth-child(2) {
  position: static; left: auto; box-shadow: none; min-width: 5.5rem;
  max-width: none; overflow: visible; text-align: center;
}
.dash-heat-tbl th:nth-child(2) { position: sticky; top: 0; z-index: 3; }
.dash-heat-tbl td:nth-child(2) { position: relative; z-index: 1; }
.dash-heat-btn {
  display: flex; align-items: center; justify-content: center; width: 100%;
  min-height: 44px; padding: var(--s1) var(--s2); border: none; background: transparent;
  color: inherit; font: inherit; font-size: 0.8125rem; font-weight: 600;
  cursor: pointer; border-radius: 0; text-align: center;
  transition: background var(--t-fast), color var(--t-fast);
}
.dash-th-kelas .dash-heat-btn { justify-content: flex-start; }
.dash-heat-btn:hover { background: var(--accent-soft); color: var(--accent); border: none; }
.dash-heat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 7; }
.dash-mapel-short { display: none; }

<script>
"use strict";
/* ===== Konfigurasi ===== */
const API_URL = "https://script.google.com/macros/s/AKfycby7hXngXJgR5IOajI-nUy-s-fd6IbnGR1YY9tro_Gb0w-rieewaOF37OLoKUpgYdiY/exec";
const KKM = 75;
const API_TIMEOUT_MS = 25000;
const REFRESH_COOLDOWN_S = 30;
const URL_REVOKE_DELAY_MS = 60000;
const SESSION_KEY = "rn_session", DATA_KEY = "rn_data";
const LABELS = { INFORMATIKA: "Informatika" };
const BINS = [[0, "0–49"], [50, "50–59"], [60, "60–69"], [70, "70–79"], [80, "80–89"], [90, "90–100"]];

/* ===== Util ===== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label = m => LABELS[m] || m;
const fmt = n => n == null ? "–" : (Math.round(n * 10) / 10).toLocaleString("id-ID");
function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const tgl = d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  const jam = d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", hour12: false }).replace(":", ".");
  return `Diperbarui ${tgl}, ${jam}`;
}
const natural = (a, b) => a.localeCompare(b, "id", { numeric: true });
const store = {
  get: k => { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* penyimpanan penuh/ditolak: abaikan */ } },
  del: k => { try { sessionStorage.removeItem(k); } catch { /* abaikan */ } },
};

/* ===== API ===== */
async function api(payload) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), API_TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload), signal: ctl.signal });
    const json = await res.json();
    if (!json.ok) throw Object.assign(new Error(json.message), { code: json.code });
    return json;
  } catch (e) {
    if (e.code) throw e;
    throw Object.assign(new Error(e.name === "AbortError" ? "Server terlalu lama merespons. Coba lagi." : "Tidak dapat terhubung. Periksa koneksi internet."), { code: "NETWORK" });
  } finally { clearTimeout(timer); }
}

/* ===== Statistik (fungsi murni) ===== */
const valid = v => typeof v === "number" && Number.isFinite(v);
const avg = xs => { const v = xs.filter(valid); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const tingkat = k => String(k).split(".")[0];
function summary(d) {
  const all = d.siswa.flatMap(s => s.nilai).filter(valid);
  return { siswa: d.siswa.length, kelas: new Set(d.siswa.map(s => s.kelas)).size, rata: avg(all), tuntas: all.length ? all.filter(v => v >= KKM).length / all.length * 100 : null };
}
const avgByMapel = d => d.mapel.map((m, i) => ({ id: i, label: label(m), value: avg(d.siswa.map(s => s.nilai[i])) })).sort((a, b) => a.value == null && b.value == null ? 0 : a.value == null ? 1 : b.value == null ? -1 : a.value - b.value);
const median = xs => {
  const v = xs.filter(valid).sort((a,b)=>a-b);
  if (!v.length) return null;
  const m = Math.floor(v.length/2);
  return v.length % 2 ? v[m] : (v[m-1]+v[m])/2;
};

const passRate = (vals, kkm = KKM) => {
  const v = vals.filter(valid);
  return v.length ? v.filter(x => x >= kkm).length / v.length * 100 : null;
};

// Bins: [0-49][50-59][60-69][70-74][75-84][85-100]
const BINS_MAPEL = [
  [0, "0–49", false], [50, "50–59", false], [60, "60–69", false],
  [70, "70–74", false], [75, "75–84", true], [85, "85–100", true]
];

const distributionFor = vals => {
  const v = vals.filter(valid);
  return BINS_MAPEL.map(([from, text], i) => {
    const to = i + 1 < BINS_MAPEL.length ? BINS_MAPEL[i+1][0] : Infinity;
    return {
      label: text,
      value: v.filter(x => x >= from && x < to).length,
      aboveKkm: BINS_MAPEL[i][2]
    };

};

const perClassTuntas = (d, mapelIdx) => {
  const g = {};
  d.siswa.forEach(s => {
    (g[s.kelas] ??= []).push(s.nilai[mapelIdx]);
  });
  return Object.keys(g).sort(natural).map(k => {
    const v = g[k].filter(valid);
    const tuntas = v.filter(x => x >= KKM).length;
    return {
      kelas: k,
      tuntas,
      total: v.length,
      pct: v.length ? tuntas / v.length * 100 : null
    };
  }).filter(x => x.total > 0);
};

const remedialList = (d, mapelIdx) => {
  return d.siswa
    .filter(s => valid(s.nilai[mapelIdx]) && s.nilai[mapelIdx] < KKM)
    .map(s => ({
      nama: s.nama,
      kelas: s.kelas,
      nilai: s.nilai[mapelIdx],
      gap: s.nilai[mapelIdx] - KKM
    }))
    .sort((a, b) => b.nilai - a.nilai); // paling dekat KKM dulu
};

const priorityOf = gap =>
  gap >= -5  ? { key: "hampir",    label: "Hampir",    cls: "is-hampir" } :
  gap >= -15 ? { key: "bimbingan", label: "Bimbingan", cls: "is-bimbingan" } :
               { key: "kritis",    label: "Kritis",    cls: "is-kritis" };
const distribution = d => {
  const all = d.siswa.flatMap(s => s.nilai).filter(valid);
  return BINS.map(([from, text], i) => {
    const to = i + 1 < BINS.length ? BINS[i + 1][0] : Infinity;
    return { label: text, value: all.filter(v => v >= from && v < to).length };
  });
};
function kelengkapan(d) {
  if (!d || !d.siswa || !d.siswa.length || !d.mapel || !d.mapel.length) {
    return { total: 0, terisi: 0, kosong: 0, pct: null, mapelKosong: [] };
  }
  const islamIdxs = [];
  const kristenIdxs = [];
  const relIdxs = [];
  d.mapel.forEach((m, idx) => {
    const lbl = label(m);
    if (/islam|pai\b|paibp/i.test(lbl)) islamIdxs.push(idx);
    if (/kristen|katolik|pak\b|pakbp/i.test(lbl)) kristenIdxs.push(idx);
    if (/agama|kepercayaan/i.test(lbl)) relIdxs.push(idx);
  });

  const isWajib = (s, j) => {
    if (valid(s.nilai[j])) return true;
    if (kristenIdxs.includes(j)) {
      if (islamIdxs.some(k => valid(s.nilai[k]))) return false;
    }
    if (islamIdxs.includes(j)) {
      if (kristenIdxs.some(k => valid(s.nilai[k]))) return false;
    }
    if (relIdxs.includes(j)) {
      if (relIdxs.some(k => k !== j && valid(s.nilai[k]))) return false;
    }
    return true;
  };

  let total = 0;
  let terisi = 0;
  const missingCounts = new Uint32Array(d.mapel.length);

  for (let i = 0; i < d.siswa.length; i++) {
    const s = d.siswa[i];
    const vals = s.nilai;
    for (let j = 0; j < d.mapel.length; j++) {
      if (isWajib(s, j)) {
        total++;
        if (valid(vals[j])) {
          terisi++;
        } else {
          missingCounts[j]++;
        }
      }
    }
  }

  const kosong = total - terisi;
  const pct = total > 0 ? (terisi / total * 100) : null;
  const mapelKosong = d.mapel.map((m, j) => ({
    label: label(m),
    count: missingCounts[j]
  })).filter(m => m.count > 0).sort((a, b) => b.count - a.count);

  return { total, terisi, kosong, pct, mapelKosong };
}

/* ===== Ekspor .xlsx (tanpa library) ===== */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files) {
  const te = new TextEncoder(), parts = [], cen = []; let off = 0;
  for (const [name, text] of files) {
    const nb = te.encode(name), d = te.encode(text), c = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, d);
    const k = new DataView(new ArrayBuffer(46));
    k.setUint32(0, 0x02014b50, true); k.setUint16(4, 20, true); k.setUint16(6, 20, true); k.setUint16(8, 0x800, true); k.setUint16(14, 0x21, true);
    k.setUint32(16, c, true); k.setUint32(20, d.length, true); k.setUint32(24, d.length, true); k.setUint16(28, nb.length, true); k.setUint32(42, off, true);
    cen.push(new Uint8Array(k.buffer), nb); off += 30 + nb.length + d.length;
  }
  const size = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
const colName = i => (i >= 26 ? colName(Math.floor(i / 26) - 1) : "") + String.fromCharCode(65 + i % 26);
function downloadXlsx(rows, fileName) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const sheet = rows.map((r, i) => `<row r="${i + 1}">` + r.map((v, j) => {
    const ref = colName(j) + (i + 1);
    if (v == null || v === "") return "";
    return valid(v) ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t>${x(v)}</t></is></c>`;
  }).join("") + "</row>").join("");
  const ns = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"', head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const blob = zipStore([
    ["[Content_Types].xml", `${head}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`],
    ["_rels/.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `${head}<workbook ${ns} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Nilai" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml", `${head}<worksheet ${ns}><sheetData>${sheet}</sheetData></worksheet>`],
  ]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.hidden = true;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), URL_REVOKE_DELAY_MS);
}

function insights(d) {
  if (!d || !d.siswa || !d.siswa.length || !d.mapel || !d.mapel.length) {
    return [{ type: "info", text: "Belum ada data nilai yang cukup untuk dianalisis." }];
  }
  const kl = kelengkapan(d);
  if (!kl.terisi) {
    return [{ type: "info", text: "Belum ada nilai yang dimasukkan ke spreadsheet." }];
  }

  const mapelAvgs = d.mapel.map((m, i) => {
    const scores = d.siswa.map(s => s.nilai[i]).filter(valid);
    return { id: i, label: label(m), avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null };
  }).filter(m => m.avg !== null);

  const kList = kelasList(d);
  const kelasAvgs = kList.map(k => {
    const scores = d.siswa.filter(s => s.kelas === k).flatMap(s => s.nilai).filter(valid);
    return { kelas: k, avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null };
  }).filter(k => k.avg !== null);

  const belowMapel = mapelAvgs.filter(m => m.avg < KKM);
  const sortedMapel = [...mapelAvgs].sort((a, b) => a.avg - b.avg);
  const sortedKelas = [...kelasAvgs].sort((a, b) => a.avg - b.avg);
  const res = [];

  // 1. Peringatan kelengkapan pengisian nilai bila ada nilai kosong
  if (kl.kosong > 0 && kl.mapelKosong.length > 0) {
    res.push({
      type: "warn",
      text: `${kl.kosong} nilai belum diinput (${kl.mapelKosong[0].label} terbanyak: ${kl.mapelKosong[0].count} siswa belum dinilai).`,
      act: "nav-mapel",
      mapel: kl.mapelKosong[0].id,
      badge: "Cek Mapel"
    });
  }

  // 2. Mapel dengan rata-rata terendah di bawah KKM
  if (sortedMapel.length && sortedMapel[0].avg < KKM) {
    res.push({
      type: "warn",
      text: `Mata pelajaran ${sortedMapel[0].label} memiliki rata-rata terendah (${fmt(sortedMapel[0].avg)}), di bawah KKM ${KKM}.`,
      act: "nav-mapel",
      mapel: sortedMapel[0].id,
      badge: "Buka Mapel"
    });
  }

  // 3. Jumlah mapel di bawah KKM bila > 1
  if (belowMapel.length > 1 && res.length < 3) {
    res.push({
      type: "warn",
      text: `Terdapat ${belowMapel.length} dari ${mapelAvgs.length} mata pelajaran dengan rata-rata di bawah KKM ${KKM}.`,
      act: "nav-mapel",
      mapel: belowMapel[0].id,
      badge: "Cek Mapel"
    });
  } else if (belowMapel.length === 1 && !res.some(r => r.text.includes(belowMapel[0].label)) && res.length < 3) {
    res.push({
      type: "warn",
      text: `Mata pelajaran ${belowMapel[0].label} adalah satu-satunya mapel di bawah KKM (${fmt(belowMapel[0].avg)}).`,
      act: "nav-mapel",
      mapel: belowMapel[0].id,
      badge: "Buka Mapel"
    });
  }

  // 4. Kelas dengan rata-rata terendah
  if (sortedKelas.length && res.length < 3) {
    const lowestK = sortedKelas[0];
    if (lowestK.avg < KKM) {
      res.push({
        type: "warn",
        text: `Kelas ${lowestK.kelas} perlu perhatian khusus dengan rata-rata ${fmt(lowestK.avg)} (di bawah KKM ${KKM}).`,
        act: "nav-kelas",
        kelas: lowestK.kelas,
        badge: "Buka Kelas"
      });
    } else if (res.length < 2 && sortedKelas.length > 1) {
      res.push({
        type: "info",
        text: `Kelas dengan rata-rata terendah saat ini adalah Kelas ${lowestK.kelas} (${fmt(lowestK.avg)}).`,
        act: "nav-kelas",
        kelas: lowestK.kelas,
        badge: "Lihat Kelas"
      });
    }
  }

  if (res.length === 0) {
    res.push({
      type: "good",
      text: `Seluruh data nilai lengkap (100%) dan seluruh mata pelajaran telah mencapai atau melampaui KKM ${KKM}.`,
      badge: "Optimal"
    });
  }

  return res.slice(0, 3);
}

function matrixAgg(d, tg) {
  const ks = kelasList(d).filter(k => !tg || tingkat(k) === tg);
  const kIndex = {};
  for (let i = 0; i < ks.length; i++) kIndex[ks[i]] = i;
  const nMapel = d.mapel.length;
  const sums = Array.from({ length: ks.length }, () => new Float64Array(nMapel));
  const counts = Array.from({ length: ks.length }, () => new Uint16Array(nMapel));

  for (let i = 0; i < d.siswa.length; i++) {
    const s = d.siswa[i];
    const r = kIndex[s.kelas];
    if (r === undefined) continue;
    const vals = s.nilai;
    for (let j = 0; j < nMapel; j++) {
      const v = vals[j];
      if (typeof v === "number" && Number.isFinite(v)) {
        sums[r][j] += v;
        counts[r][j]++;
      }
    }
  }

  return ks.map((k, r) => ({
    kelas: k,
    mapelAvgs: Array.from({ length: nMapel }, (_, c) => counts[r][c] > 0 ? sums[r][c] / counts[r][c] : null)
  }));
}

}

function viewDashboard() {
  const d = S.data, sm = summary(d), tks = [...new Set(d.siswa.map(s => tingkat(s.kelas)))].sort(natural);
  const kl = kelengkapan(d);
  const insList = insights(d);
  const matrix = matrixAgg(d, S.tg);
  const C = 276.46;

  // Cincin 1: Ketuntasan Belajar
  const tuntasPct = sm.tuntas == null ? 0 : Math.min(100, Math.max(0, sm.tuntas));
  const tuntasOffset = (C * (1 - tuntasPct / 100)).toFixed(2);
  const tuntasAria = sm.tuntas == null ? "belum ada data" : `${fmt(sm.tuntas)} persen siswa mencapai atau melampaui KKM ${KKM}`;

  // Cincin 2: Kelengkapan Data
  const kelengkapanVal = kl.pct == null ? 0 : Math.min(100, Math.max(0, kl.pct));
  const kelengkapanOffset = (C * (1 - kelengkapanVal / 100)).toFixed(2);
  const kelengkapanAria = kl.pct == null ? "belum ada data" : `Kelengkapan data: ${kl.terisi} dari ${kl.total} nilai terisi (${fmt(kl.pct)} persen)`;

}
function kelasRows() {
  const d = S.data, q = S.q.trim().toLowerCase();
  return d.siswa.filter(s => s.kelas === S.kelas && (!q || s.nama.toLowerCase().includes(q) || String(s.no_urut).includes(q)));
}
function viewKelas() {
  const d = S.data, rows = kelasRows();
  return `<div class="row"><div><label for="kelas">Kelas</label><select id="kelas">${options(kelasList(d).map(k => [k, "Kelas " + k]), S.kelas)}</select></div>
    <div><label for="q">Cari siswa</label><input id="q" type="search" value="${esc(S.q)}" placeholder="Nama atau nomor"></div>
    <button data-act="export-kelas">Unduh .xlsx</button></div>
  ${rows.length ? `<p class="muted scroll-hint" style="font-size:0.75rem; margin-bottom:var(--s1)">&larr; Geser tabel ke kanan untuk melihat seluruh mapel &rarr;</p>
  <div class="tw"><table>${chunkHead(d.mapel.map(label).concat("Rata-rata"))}<tbody>${rows.map(s => `<tr><td>${esc(s.no_urut)}</td><th scope="row" title="${esc(s.nama)}">${esc(s.nama)}</th>${s.nilai.map(v => `<td>${cell(v)}</td>`).join("")}<td><b>${cell(avg(s.nilai))}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td></td><td>Rata-rata kelas</td>${d.mapel.map((_, i) => `<td>${fmt(avg(rows.map(s => s.nilai[i])))}</td>`).join("")}<td>${fmt(avg(rows.map(s => avg(s.nilai))))}</td></tr></tfoot></table></div>` : `<div class="card empty">Tidak ada siswa yang cocok.</div>`}`;
}
function mapelRows() {
  const i = S.mapel;
  return S.data.siswa
    .filter(s => !S.mapelKelas || s.kelas === S.mapelKelas)
    .filter(s => valid(s.nilai[i]))
    .sort(S.mapelKelas
      ? (a, b) => natural(a.nama, b.nama) || natural(a.kelas, b.kelas) || natural(String(a.no_urut), String(b.no_urut))
      : (a, b) => (b.nilai[i] - a.nilai[i]) || natural(a.nama, b.nama) || natural(a.kelas, b.kelas) || natural(String(a.no_urut), String(b.no_urut)));
}
function viewMapel() {
  const d = S.data, i = S.mapel, rows = mapelRows();
  const vals = rows.map(s => s.nilai[i]);
  const below = vals.filter(v => v < KKM).length;
  const pRate = passRate(vals);
  const med = median(vals);

  const pkList = perClassTuntas(d, i).filter(c => !S.mapelKelas || c.kelas === S.mapelKelas);
  const remList = remedialList(d, i).filter(s => !S.mapelKelas || s.kelas === S.mapelKelas);
  const sortInfo = S.mapelKelas ? "Diurutkan berdasarkan nama (A–Z)" : "Diurutkan dari nilai tertinggi ke terendah";

  return `<div class="row"><div><label for="mapel">Mata pelajaran</label><select id="mapel">${options(d.mapel.map((m, k) => [k, label(m)]), i)}</select></div>
    <div><label for="mk">Kelas</label><select id="mk">${options(kelasList(d).map(k => [k, "Kelas " + k]), S.mapelKelas, "Semua kelas")}</select></div>

  <div class="grid stats" style="margin-bottom:var(--s3)">${[
    ["Rata-rata", fmt(avg(vals))],
    ["Tertinggi", vals.length ? fmt(Math.max(...vals)) : "–"],
    ["Terendah", vals.length ? fmt(Math.min(...vals)) : "–"],
    ["Median", fmt(med)],
    ["Ketuntasan", pRate == null ? "–" : fmt(pRate) + "%"],

  ].map(([t, v]) => `<div class="card stat"><span class="muted">${t}</span><b>${v}</b></div>`).join("")}</div>
  <div class="grid two" style="margin-bottom:var(--s3)">
    <section class="card mp-histogram" aria-labelledby="mp-hist-title">
      <h3 id="mp-hist-title">Sebaran Nilai</h3>
      <p class="muted">Distribusi frekuensi nilai (KKM ${KKM})</p>
      ${vhist(distributionFor(vals))}

    <section class="card mp-perkelas" aria-labelledby="mp-pk-title">

      ${pkList.length ? `
        <div class="mp-perkelas-list" role="list" aria-label="Daftar ketuntasan per kelas">
          ${pkList.map(c => {
            const cls = c.pct >= 80 ? "is-good" : c.pct >= 50 ? "is-warning" : "is-low";
            const w = Math.min(100, Math.max(0, c.pct || 0));
            return `<div class="mp-perkelas-row" role="listitem">
              <span title="Kelas ${esc(c.kelas)}">Kelas ${esc(c.kelas)}</span>
              <div class="mp-perkelas-track" aria-hidden="true">
                <div class="mp-perkelas-fill ${cls}" style="width:${w}%"></div>
              </div>
              <div class="mp-perkelas-count">
                <b>${fmt(c.pct)}%</b> (${c.tuntas}/${c.total})
              </div>
            </div>`;
          }).join("")}
        </div>
      ` : `<div class="empty">Belum ada data nilai kelas.</div>`}
    </section>
  </div>
  <section class="card mp-table" style="margin-bottom:var(--s3); padding:0; overflow:hidden">
    <div style="padding:var(--s3) var(--s3) var(--s2)">
      <h3 id="mp-tbl-title">Daftar Nilai Siswa</h3>
      <p id="mp-tbl-desc" class="muted" style="margin:0">${sortInfo}</p>
    </div>
    ${rows.length ? `
      <div class="tw" style="border:0">
        <table aria-labelledby="mp-tbl-title" aria-describedby="mp-tbl-desc">
          <caption class="sr-only">Daftar nilai siswa. ${sortInfo}.</caption>
          <thead>
            <tr>
              <th scope="col" style="width:3rem">#</th>
              <th scope="col">Nama</th>
              <th scope="col" style="text-align:center">Kelas</th>
              <th scope="col">Nilai</th>
              <th scope="col" style="text-align:center">Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((s, n) => {
              const val = s.nilai[i];
              const isTuntas = val >= KKM;
              const rowCls = isTuntas ? "" : ' class="mp-row-below"';
              const statusHtml = isTuntas
                ? `<span class="mp-status is-tuntas">✓ Tuntas</span>`
                : `<span class="mp-status is-belum">✕ Belum</span>`;
              return `<tr${rowCls}>
                <td>${n + 1}</td>
                <th scope="row" title="${esc(s.nama)}">${esc(s.nama)}</th>
                <td style="text-align:center">${esc(s.kelas)}</td>
                <td>${cell(val)}</td>
                <td style="text-align:center">${statusHtml}</td>

            }).join("")}
          </tbody>
        </table>
      </div>
    ` : `<div class="empty">Belum ada nilai untuk pilihan ini.</div>`}
  </section>
  <section class="card mp-remedial" aria-labelledby="mp-rm-title">
    <div class="mp-remedial-head">
      <div>
        <h3 id="mp-rm-title" style="display:inline-block; margin-right:var(--s2)">Zona Remedial</h3>
        ${remList.length ? `<span class="mp-remedial-count">${remList.length} siswa</span>` : ""}
      </div>
      <p class="muted" style="margin:0">Prioritas intervensi: paling dekat KKM didahulukan</p>
    </div>
    ${remList.length ? `
      <div class="mp-remedial-list" role="list" aria-label="Daftar siswa remedial">

          return `<div class="mp-remedial-item ${prio.cls}" role="listitem">
            <span class="mp-rm-name" title="${esc(s.nama)}">
              <span class="mp-rm-prio ${prio.cls}" aria-hidden="true">${prio.label}</span>
              ${esc(s.nama)}
            </span>
            <span class="mp-rm-kelas">Kelas ${esc(s.kelas)}</span>
            <span class="mp-rm-nilai">${fmt(s.nilai)}</span>
            <span class="mp-rm-gap" title="Selisih terhadap KKM ${KKM}">(${gapText})</span>
          </div>`;
        }).join("")}
      </div>
    ` : `<div class="empty">Tidak ada siswa di bawah KKM.</div>`}
  </section>`;
}
const VIEWS = { dashboard: ["Dashboard", viewDashboard], kelas: ["Nilai per kelas", viewKelas], mapel: ["Nilai per mapel", viewMapel] };

/* ===== Render ===== */
function render() {
  const keep = document.activeElement && document.activeElement.id;
  const pos = document.activeElement && document.activeElement.selectionStart;
  const viewChanged = S._view !== S.view;
  const animate = viewChanged || !!S.data !== S._hadData;
  S._view = S.view; S._hadData = !!S.data;

  $("#app").innerHTML = S.sess ? viewApp() : viewLogin();
  $("#app").classList.toggle("no-anim", !animate);
  if (viewChanged) window.scrollTo(0, 0);
  const el = keep && document.getElementById(keep);
  if (el) { el.focus(); if (pos != null && el.setSelectionRange && el.type === "search") el.setSelectionRange(pos, pos); }
  if (typeof requestAnimationFrame !== "undefined") {
    requestAnimationFrame(() => {
      document.querySelectorAll(".dash-ring-bar[data-offset]").forEach(bar => {
        bar.style.strokeDashoffset = bar.dataset.offset;
      });
    });
  }
}

/* ===== Aksi ===== */
function logout(msg = "") {
  S.sess = null; S.data = null; S.setupToken = ""; S.error = msg; S.updatedAt = null;
  store.del(SESSION_KEY); store.del(DATA_KEY); render();
}
function startSession(r) {
  S.sess = { token: r.token, nama: r.guru.nama, exp: r.expiresAt }; store.set(SESSION_KEY, S.sess);
  S.setupToken = ""; S.error = ""; loadData(false);
}
async function loadData(force) {
  if (!S.sess) return;
  const cached = store.get(DATA_KEY);
  if (cached) {
    if (!S.data) { S.data = cached.data; initSelections(); }
    if (cached.updatedAt) S.updatedAt = cached.updatedAt;
  }
  S.loading = true; S.error = ""; render();
  try {
    const r = await api({ action: "data", token: S.sess.token, since: cached ? cached.version : "", force });
    if (r.unchanged) {
      if (!S.data && cached) S.data = cached.data;
      if (cached && cached.updatedAt) S.updatedAt = cached.updatedAt;
    } else {
      S.data = { mapel: r.mapel, siswa: r.siswa };
      S.updatedAt = Date.now();
      store.set(DATA_KEY, { version: r.version, data: S.data, updatedAt: S.updatedAt });
    }
    initSelections();
  } catch (e) {
    if (e.code === "SESSION_EXPIRED") return logout(e.message);
    S.error = e.message + (S.data ? " Menampilkan data terakhir." : "");
  } finally { S.loading = false; render(); }
}
function initSelections() {
  const ks = kelasList(S.data);
  if (!ks.includes(S.kelas)) S.kelas = ks[0] || "";
  if (S.mapel >= S.data.mapel.length) S.mapel = 0;
}
function startCooldown() {
  S.cooldown = REFRESH_COOLDOWN_S;
  const t = setInterval(() => {
    S.cooldown--;
    const b = document.querySelector('[data-act="refresh"]');
    if (b && !S.loading) {
      b.disabled = S.cooldown > 0;
      b.textContent = S.cooldown > 0 ? `Segarkan (${S.cooldown})` : "Segarkan";
    }
    if (S.cooldown <= 0) clearInterval(t);
  }, 1000);
}
function exportRows(kind) {
  const d = S.data, head = ["Kelas", "No", "Nama", ...d.mapel.map(label)];
  if (kind === "kelas") return [["No", "Nama", ...d.mapel.map(label), "Rata-rata"], ...kelasRows().map(s => [s.no_urut, s.nama, ...s.nilai, avg(s.nilai)])];
  if (kind === "mapel") return [["No", "Nama", "Kelas", label(d.mapel[S.mapel])], ...mapelRows().map((s, n) => [n + 1, s.nama, s.kelas, s.nilai[S.mapel]])];
  return [head, ...d.siswa.map(s => [s.kelas, s.no_urut, s.nama, ...s.nilai])];
}
const safeName = t => t.replace(/[^\w.-]+/g, "_");

/* ===== Event ===== */
document.addEventListener("submit", async e => {
  if (e.target.id !== "f-login") return;
  e.preventDefault();
  const btn = e.target.querySelector("button"), v = id => (document.getElementById(id)?.value || "").trim();
  S.error = "";
  try {
    if (S.setupToken) {
      if (!/^\d{6}$/.test(v("pin"))) throw new Error("PIN harus terdiri dari 6 angka.");
      if (v("pin") !== v("pin2")) throw new Error("Kedua PIN tidak sama.");
    } else if (!/^\d{8,20}$/.test(v("nip").replace(/\s+/g, "")) || !v("secret")) throw new Error("Isi NIP (angka) dan PIN/kode aktivasi.");
    btn.disabled = true; btn.textContent = "Memproses…";
    const r = S.setupToken ? await api({ action: "setPin", setupToken: S.setupToken, pin: v("pin") })
                           : await api({ action: "login", nip: v("nip").replace(/\s+/g, ""), secret: v("secret") });
    if (r.needsPin) { S.setupToken = r.setupToken; S.nama = r.nama; render(); $("#pin").focus(); return; }
    startSession(r);
  } catch (err) {
    if (err.code === "SESSION_EXPIRED") S.setupToken = "";
    S.error = err.message; render();
  }
});
document.addEventListener("click", e => {
  const pw = e.target.closest("[data-toggle-pw]");
  if (pw) {
    const input = document.getElementById(pw.dataset.togglePw);
    if (input) {
      const isPw = input.type === "password";
      input.type = isPw ? "text" : "password";
      pw.textContent = isPw ? "Sembunyikan" : "Tampilkan PIN";
      pw.setAttribute("aria-label", isPw ? "Sembunyikan PIN" : "Tampilkan PIN");
    }
    return;
  }
  const v = e.target.closest("[data-view]"), a = e.target.closest("[data-act]");
  if (v) { S.view = v.dataset.view; render(); return; }
  if (!a) return;
  const act = a.dataset.act, d = S.data;
  if (act === "nav-kelas") {
    S.view = "kelas";
    S.kelas = a.dataset.kelas;
    render();
  }
  else if (act === "nav-mapel") {
    S.view = "mapel";
    S.mapel = Number(a.dataset.mapel);
    S.mapelKelas = "";
    render();
  }
  else if (act === "logout") {
    if (window.confirm("Apakah Anda yakin ingin keluar dari aplikasi?")) logout();
  }
  else if (act === "retry") loadData(false);
  else if (act === "refresh") { startCooldown(); loadData(true); }
  else if (d && act.startsWith("export-")) {
    const kind = act.slice(7), name = kind === "kelas" ? "Kelas_" + S.kelas : kind === "mapel" ? label(d.mapel[S.mapel]) : "Semua_Nilai";
    downloadXlsx(exportRows(kind), safeName("Nilai_" + name) + ".xlsx");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const act = e.target.closest?.("[data-act][role='button']");
    if (act) { e.preventDefault(); act.click(); }
  }
});
document.addEventListener("change", e => {
  const m = { kelas: v => S.kelas = v, mapel: v => S.mapel = Number(v), mk: v => S.mapelKelas = v, tg: v => S.tg = v }[e.target.id];
  if (m) { m(e.target.value); render(); }
});
let searchTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      S.q = e.target.value;
      const d = S.data;
      if (!d) return;
      const rows = kelasRows();
      const tbody = document.querySelector(".tw tbody");
      const tfoot = document.querySelector(".tw tfoot");
      if (tbody && rows.length) {
        tbody.innerHTML = rows.map(s => `<tr><td>${esc(s.no_urut)}</td><th scope="row" title="${esc(s.nama)}">${esc(s.nama)}</th>${s.nilai.map(v => `<td>${cell(v)}</td>`).join("")}<td><b>${cell(avg(s.nilai))}</b></td></tr>`).join("");
        if (tfoot) tfoot.innerHTML = `<tr><td></td><td>Rata-rata kelas</td>${d.mapel.map((_, i) => `<td>${fmt(avg(rows.map(s => s.nilai[i])))}</td>`).join("")}<td>${fmt(avg(rows.map(s => avg(s.nilai))))}</td></tr>`;
      } else {
        render();
      }
    }, 150);
  }
});

/* ===== Mulai ===== */
if (S.sess && S.sess.exp > Date.now()) loadData(false); else { store.del(SESSION_KEY); store.del(DATA_KEY); S.sess = null; render(); }
</script>
</body>
