<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekap Nilai</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--surface:#ffffff;--text:#0f172a;--text-muted:#64748b;--muted:var(--text-muted);--line-subtle:#e2e8f0;--line:var(--line-subtle);--border-control:#8e8e93;--accent:#2563eb;--accent-fg:#ffffff;--bad:#dc2626;--bad-bg:#fef2f2;--heat-1:#f2f6fe;--heat-2:#e0e9fc;--heat-3:#cfddfb;--heat-4:#b9cdf9;--heat-5:#a3bdf7;--s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--r-sm:6px;--r-md:8px;--r-full:9999px;--r:var(--r-md);--shadow-card:0 1px 2px 0 rgba(0,0,0,.05);--shadow-sticky:2px 0 4px -2px rgba(0,0,0,.12);--t-fast:150ms cubic-bezier(0.4, 0, 0.2, 1);--t-normal:220ms cubic-bezier(0.4, 0, 0.2, 1);--t:var(--t-fast);--font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:700 1.5rem/1.25 var(--font-family);--font-h1:600 1.25rem/1.3 var(--font-family);--font-h2:600 1rem/1.35 var(--font-family);--font-body:400 0.9375rem/1.5 var(--font-family);--font-caption:400 0.8125rem/1.4 var(--font-family);--font-micro:500 0.6875rem/1.3 var(--font-family)}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--surface:#18181b;--text:#f4f4f5;--text-muted:#a1a1aa;--line-subtle:#27272a;--border-control:#64748b;--accent:#6b9bff;--accent-fg:#09090b;--bad:#f87171;--bad-bg:#2a1215;--heat-1:#1f222d;--heat-2:#252d3f;--heat-3:#2e3a56;--heat-4:#384a72;--heat-5:#425a8d;--shadow-card:0 1px 2px 0 rgba(0,0,0,.3);--shadow-sticky:2px 0 4px -2px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:var(--font-body);background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
h1,h2,h3{margin:0}h1,h2{font:var(--font-h1)}h3{font:var(--font-h2)}
.muted{color:var(--muted);font:var(--font-caption)}
.wrap{max-width:72rem;margin:0 auto;padding:var(--s3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:var(--s3)}
.grid{display:grid;gap:var(--s3)}
.stats{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}

.stat b{display:block;font:var(--font-display);font-variant-numeric:tabular-nums}
button,input,select{font:var(--font-body);color:inherit;min-height:44px;border-radius:var(--r-md);border:1px solid var(--border-control);background:var(--surface);padding:0 var(--s3)}
button{cursor:pointer;transition:background var(--t-fast),opacity var(--t-fast),color var(--t-fast)}
button:hover{background:var(--bg)}button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.primary:hover{opacity:.9}
button.subtle{border-color:transparent;background:none;color:var(--muted)}
button.subtle:hover{background:var(--bg);color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:block;font-weight:500;margin-bottom:var(--s1)}
input,select{width:100%}
.field{margin-bottom:var(--s3)}

}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:end;margin-bottom:var(--s3)}
.row>*{flex:1 1 11rem}.row>button{flex:0 0 auto}
.login{max-width:24rem;margin:clamp(1.5rem, 6vh, 4rem) auto}
.err{color:var(--bad);margin:var(--s2) 0;min-height:1.4em}
.banner{border:1px solid var(--bad);color:var(--bad);background:var(--bad-bg);border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s3);display:flex;gap:var(--s3);justify-content:space-between;align-items:center;flex-wrap:wrap;transition:opacity var(--t-normal)}

  .bar > span:first-child { grid-area: label; }

  .bar-header { display: flex; justify-content: space-between; font-size: 0.8125rem; }
}
.track{position:relative;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-full);overflow:visible}
.fill{height:100%;background:var(--accent);border-radius:var(--r-full);transition:width var(--t-normal)}
.fill.low{background:var(--bad)}
.kkm{position:absolute;top:-4px;bottom:-4px;width:2px;background:#ffffff;box-shadow:0 0 2px rgba(0,0,0,.6);z-index:2}
.tw{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:inset -10px 0 8px -8px rgba(0,0,0,.15)}
.scroll-hint{font:var(--font-micro)}
@media (min-width:1200px){.scroll-hint{display:none}}
table{border-collapse:separate;border-spacing:0;width:100%;font:var(--font-caption);font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;background:var(--surface);font-variant-numeric:tabular-nums}

th:first-child,td:first-child{position:sticky;left:0;z-index:2;width:2.75rem;min-width:2.75rem;text-align:center;background:var(--surface)}
th:nth-child(2),td:nth-child(2){position:sticky;left:2.75rem;z-index:2;min-width:8rem;max-width:9.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:var(--surface);border-right:1px solid var(--line);box-shadow:var(--shadow-sticky)}
th:first-child,th:nth-child(2){z-index:4}
@media (min-width:640px){th:nth-child(2),td:nth-child(2){max-width:14rem}}
tfoot td{font-weight:600;position:sticky;bottom:0;z-index:2;background:var(--surface)}
tfoot td:first-child,tfoot td:nth-child(2){z-index:3}
.low{color:var(--bad);background:var(--bad-bg);padding:2px 6px;border-radius:var(--r-sm);font-weight:600;font-variant-numeric:tabular-nums}
.skel{height:6rem;border-radius:var(--r-md);background:var(--line);animation:p 1.2s infinite alternate}
@keyframes p{to{opacity:.4}}
.empty{text-align:center;padding:var(--s4);color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.dash-hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:var(--s3);align-items:stretch}
.dash-rings{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.dash-ring-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--s3) var(--s2)}

.dash-ring-svg{width:108px;height:108px;display:block}
.dash-ring-bar{transition:stroke-dashoffset var(--t-normal)}
.dash-ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dash-ring-pct{font:var(--font-h1);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}

.dash-ring-caption{margin-top:var(--s2);font:var(--font-caption);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.dash-stats{display:grid;grid-template-columns:1fr;gap:var(--s2)}
.dash-stats .card{display:flex;flex-direction:column;justify-content:center}
@media (max-width:900px){
  .dash-hero{grid-template-columns:1fr}
  .dash-stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:440px){
  .dash-rings{grid-template-columns:1fr 1fr;gap:var(--s1)}
  .dash-ring-card{padding:var(--s2) var(--s1)}
  .dash-ring-box{width:96px;height:96px}
  .dash-ring-svg{width:96px;height:96px}
  .dash-ring-pct{font-size:1.125rem}
  .dash-ring-caption{font-size:0.75rem}
  .dash-stats{grid-template-columns:repeat(3,1fr);gap:var(--s1)}

  .dash-stats .card b{font-size:1.125rem}
}
.dash-attention{margin-top:var(--s3);border-left:4px solid var(--accent)}
.dash-attention-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s2);gap:var(--s2);flex-wrap:wrap}
.dash-attention-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.dash-attention-item{display:flex;align-items:flex-start;gap:var(--s2);font:var(--font-body);line-height:1.45}
.dash-att-marker{flex:0 0 1.25rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.dash-attention-item.is-warn .dash-att-marker{color:var(--bad)}
.dash-attention-item.is-good .dash-att-marker{color:var(--accent)}
.dash-attention-item.is-info .dash-att-marker{color:var(--muted)}
.dash-heat-tw{max-height:26rem;position:relative}
.dash-heat-tbl{border-collapse:separate;border-spacing:0;width:100%}
.dash-heat-tbl th,.dash-heat-tbl td{padding:0;text-align:center;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.dash-heat-tbl th{position:sticky;top:0;z-index:3;background:var(--surface);font-weight:600}
.dash-th-corner{position:sticky;top:0;left:0;z-index:6!important;background:var(--surface);min-width:6rem;border-right:1px solid var(--line);box-shadow:var(--shadow-sticky);padding:0 var(--s2);text-align:left;vertical-align:middle;font-size:0.8125rem}
.dash-th-kelas{position:sticky;left:0;z-index:4!important;background:var(--surface);min-width:6rem;text-align:left;border-right:1px solid var(--line);box-shadow:var(--shadow-sticky)}
.dash-th-mapel{min-width:5.5rem}
.dash-heat-tbl th:nth-child(2),.dash-heat-tbl td:nth-child(2){position:static;left:auto;box-shadow:none;min-width:5.5rem;max-width:none;overflow:visible;text-overflow:clip;text-align:center}
.dash-heat-tbl th:nth-child(2){position:sticky;top:0;z-index:3}
.dash-heat-tbl td:nth-child(2){position:relative;z-index:1}
.dash-heat-btn{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:44px;padding:var(--s1) var(--s2);border:none;background:transparent;color:inherit;font:inherit;font-size:0.8125rem;font-weight:600;cursor:pointer;border-radius:0;text-align:center;transition:background var(--t-fast),color var(--t-fast)}
.dash-th-kelas .dash-heat-btn{justify-content:flex-start}
.dash-heat-btn:hover{background:var(--bg);color:var(--accent)}
.dash-heat-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:7}
.dash-mapel-short{display:none}
@media (max-width:960px){.dash-mapel-full{display:none}.dash-mapel-short{display:inline}.dash-th-mapel{min-width:4.25rem}.dash-heat-tbl th:nth-child(2),.dash-heat-tbl td:nth-child(2){min-width:4.25rem}}
.dash-heat-cell{min-width:4.25rem;height:44px;padding:var(--s1) var(--s2);font-size:0.8125rem;font-weight:500;color:var(--text);vertical-align:middle;position:relative}
.dash-heat-cell.heat-1{background:var(--heat-1)}
.dash-heat-cell.heat-2{background:var(--heat-2)}
.dash-heat-cell.heat-3{background:var(--heat-3)}
.dash-heat-cell.heat-4{background:var(--heat-4)}
.dash-heat-cell.heat-5{background:var(--heat-5)}
.dash-heat-cell.heat-none{background:var(--surface);color:var(--muted)}
.dash-heat-cell.heat-low{outline:1.5px dashed var(--bad);outline-offset:-2px}
.dash-low-marker{font-size:0.6875rem;margin-right:2px}
.dash-heat-legend{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);margin-top:var(--s2);font:var(--font-micro)}
.dash-legend-item{display:inline-flex;align-items:center;gap:var(--s1)}
.dash-legend-swatch{display:inline-block;width:14px;height:14px;border-radius:2px;border:1px solid var(--line)}
.dash-legend-swatch.heat-low-sample{display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:16px;height:16px;padding:0 2px;outline:1.5px dashed var(--bad);outline-offset:-1px;border:none;font-size:0.625rem}
.dash-vhist-fig{margin:0}
.dash-vhist{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s1);align-items:end;margin-top:var(--s2)}
.dash-vhist-col{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.dash-vhist-stat{display:flex;flex-direction:column;align-items:center;margin-bottom:var(--s1);font-variant-numeric:tabular-nums;line-height:1.2}
.dash-vhist-num{font-size:0.875rem;font-weight:600}
.dash-vhist-pct{font-size:0.6875rem;color:var(--muted)}
.dash-vhist-track{width:100%;max-width:2.5rem;height:120px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);display:flex;align-items:flex-end;overflow:hidden}
.dash-vhist-fill{width:100%;background:var(--accent);border-radius:calc(var(--r-sm) - 2px) calc(var(--r-sm) - 2px) 0 0;transition:height var(--t-normal)}
.dash-vhist-lbl{margin-top:var(--s1);font-size:0.6875rem;font-weight:500;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:360px){.dash-vhist-num{font-size:0.75rem}.dash-vhist-pct{font-size:0.625rem}.dash-vhist-lbl{font-size:0.625rem}}
/* ===== DESIGN REFACTOR v2 ===== */
:root {
  /* 1. Skala Spacing Tambahan */
  --s1-5: 6px;
  --s2-5: 12px;
  --s6: 48px;

  /* 2. Radius Kartu */
  --r-lg: 12px;
  --r-xl: 16px;

  /* 3. Border Kontrol */
  --border-control: #cbd5e1;
  --border-control-hover: #94a3b8;

  /* 4. Shadow Kartu (Light) */
  --shadow-card: 0 1px 2px 0 rgba(15,23,42,.04), 0 1px 3px 0 rgba(15,23,42,.06);
  --shadow-card-hover: 0 4px 10px -2px rgba(15,23,42,.08), 0 2px 4px -2px rgba(15,23,42,.05);

  /* 5. Hover Baris Tabel */
  --row-hover: #f1f5f9;

  /* 6. Accent Sekunder (Nav Aktif) & Surface-2 */
  --accent-soft: #e0ecff;
  --surface-2: #f1f5f9;

  /* 8. Heatmap Steps (Light: WCAG AA Pass >= 4.5:1) */
  --heat-1: #eaf1ff;
  --heat-2: #cfe0fd;
  --heat-3: #a8c4fb;
  --heat-4: #356ad4;
  --heat-5: #1d4ed8;

  /* 9. Font Caption & Micro */
  --font-caption: 400 0.8125rem/1.45 var(--font-family);
  --font-micro: 500 0.75rem/1.35 var(--font-family);
}

@media (prefers-color-scheme: dark) {
  :root {
    /* 3. Border Kontrol (Dark) */
    --border-control: #3f4048;
    --border-control-hover: #52535c;

    /* 4. Shadow Kartu (Dark) */
    --shadow-card: 0 1px 2px 0 rgba(0,0,0,.35), 0 1px 3px 0 rgba(0,0,0,.25);
    --shadow-card-hover: 0 4px 10px -2px rgba(0,0,0,.5);

    /* 5. Hover Baris Tabel (Dark) */
    --row-hover: #1c1d23;

    /* 6. Accent Sekunder (Dark) & Surface-2 */
    --accent-soft: #1e2b4a;
    --surface-2: #1f2026;

    /* 8. Heatmap Steps (Dark: WCAG AA Pass >= 4.5:1) */
    --heat-1: #1e2636;
    --heat-2: #233452;
    --heat-3: #2d456f;
    --heat-4: #39578f;
    --heat-5: #4a6eb0;
  }
}

/* 1. Spacing Aplikasi Minimal */
header .wrap {
  gap: var(--s2-5);
}
.grid.two {
  gap: var(--s3);
}

/* 2. Radius Kartu */
.card,
.login,
.dash-ring-card,
.dash-attention {
  border-radius: var(--r-lg);
}

/* 3. Border Kontrol */
button:hover:not(:disabled),
input:hover,
select:hover {
  border-color: var(--border-control-hover);
}
button.primary:hover:not(:disabled) {
  border-color: var(--accent);
}
button.subtle:hover:not(:disabled) {
  border-color: transparent;
}
.dash-heat-btn:hover {
  border: none;
}

/* 4. Shadow Kartu & Hover Transition */
@media (hover: hover) {
  .card:not(.stat):not(.dash-ring-card) {
    transition: box-shadow var(--t-normal);
  }
  .card:not(.stat):not(.dash-ring-card):hover {
    box-shadow: var(--shadow-card-hover);
  }
}

/* 5. Hover Baris Tabel */
.tw > table:not(.dash-heat-tbl) tbody tr {
  transition: background var(--t-fast);
}
.tw > table:not(.dash-heat-tbl) tbody tr:hover td,
.tw > table:not(.dash-heat-tbl) tbody tr:hover td:first-child,
.tw > table:not(.dash-heat-tbl) tbody tr:hover td:nth-child(2) {
  background: var(--row-hover);
}

/* 6. Accent Sekunder (Nav Aktif & Hover) */
nav button[aria-current="page"],
nav.bottom-nav button[aria-current="page"] {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent);
  font-weight: 600;
}
nav button:hover,
nav.bottom-nav button:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: transparent;
}
nav button[aria-current="page"]:hover,
nav.bottom-nav button[aria-current="page"]:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

/* 7. KKM Marker */
.kkm {
  background: var(--text);
  opacity: .35;
  box-shadow: none;
  transition: opacity var(--t-fast);
}
@media (prefers-color-scheme: dark) {
  .kkm {
    background: #ffffff;
    opacity: .7;
  }
}

/* 8. Heatmap Step Kontras */
.dash-heat-cell.heat-1, .dash-legend-swatch.heat-1 { background: #eaf1ff; color: #1e3a8a; }
.dash-heat-cell.heat-2, .dash-legend-swatch.heat-2 { background: #cfe0fd; color: #1e3a8a; }
.dash-heat-cell.heat-3, .dash-legend-swatch.heat-3 { background: #a8c4fb; color: #0f172a; }
.dash-heat-cell.heat-4, .dash-legend-swatch.heat-4 { background: #356ad4; color: #ffffff; }
.dash-heat-cell.heat-5, .dash-legend-swatch.heat-5 { background: #1d4ed8; color: #ffffff; }

@media (prefers-color-scheme: dark) {
  .dash-heat-cell.heat-1, .dash-legend-swatch.heat-1 { background: #1e2636; color: #cbd5e1; }
  .dash-heat-cell.heat-2, .dash-legend-swatch.heat-2 { background: #233452; color: #dbeafe; }
  .dash-heat-cell.heat-3, .dash-legend-swatch.heat-3 { background: #2d456f; color: #e2e8f0; }
  .dash-heat-cell.heat-4, .dash-legend-swatch.heat-4 { background: #39578f; color: #ffffff; }
  .dash-heat-cell.heat-5, .dash-legend-swatch.heat-5 { background: #4a6eb0; color: #ffffff; }
}

/* 9. Font Caption Tabel + Ellipsis */
.bar {
  grid-template-columns: 8.5rem minmax(0, 1fr) 3.75rem;
}
.bar > span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media (max-width: 440px) {
  .bar {
    grid-template-columns: 1fr auto;
  }
}

/* ===== DASHBOARD MODERN v3 ===== */

/* --- Sistem Warna Semantik Dashboard --- */
:root {
  /* Aksen utama (pertahankan biru) */
  --accent:          #2563eb;   /* blue-600 — aksi utama */
  --accent-hover:    #1d4ed8;
  --accent-soft:     #eff6ff;   /* biru lembut untuk tint card */

  /* Aksen semantik BARU (khusus dashboard) */
  --dash-emerald:    #10b981;   /* emerald-500 — tuntas/positif */
  --dash-emerald-bg: #ecfdf5;   /* emerald-50 */
  --dash-emerald-fg: #047857;   /* emerald-700 (teks) */

  --dash-amber:      #f59e0b;   /* amber-500 — perhatian */
  --dash-amber-bg:   #fffbeb;   /* amber-50 */
  --dash-amber-fg:   #b45309;   /* amber-700 */

  --dash-indigo:     #6366f1;   /* indigo-500 — kelengkapan/data */
  --dash-indigo-bg:  #eef2ff;   /* indigo-50 */

  --dash-rose:       #f43f5e;   /* rose-500 — kritis */
  --dash-rose-bg:    #fff1f2;   /* rose-50 */
  --dash-rose-fg:    #be123c;

  /* Permukaan & garis */
  --dash-surface-2:  #f8fafc;   /* slate-50 — track bar */
  --dash-line:       #e2e8f0;   /* slate-200 */
}

@media (prefers-color-scheme: dark) {
  :root {
    --accent:          #6b9bff;
    --accent-hover:    #8bb0ff;
    --accent-soft:     #1a2540;

    --dash-emerald:    #34d399;   /* emerald-400 lebih terang di dark */
    --dash-emerald-bg: #0f2a21;
    --dash-emerald-fg: #6ee7b7;

    --dash-amber:      #fbbf24;
    --dash-amber-bg:   #2a1f0b;
    --dash-amber-fg:   #fcd34d;

    --dash-indigo:     #818cf8;
    --dash-indigo-bg:  #1e1b3a;

    --dash-rose:       #fb7185;
    --dash-rose-bg:    #2a1018;
    --dash-rose-fg:    #fda4af;

    --dash-surface-2:  #1c1d23;
    --dash-line:       #2a2b31;
  }
}

/* --- ① HERO — Dual Ring + Stats --- */
.dash-ring-card:nth-child(1) {
  background: radial-gradient(120% 120% at 50% 0%, var(--dash-emerald-bg) 0%, var(--surface) 65%);
}
.dash-ring-card:nth-child(2) {
  background: radial-gradient(120% 120% at 50% 0%, var(--dash-indigo-bg) 0%, var(--surface) 65%);
}

.dash-ring-svg {
  overflow: visible;
}

.dash-ring-card:nth-child(1) .dash-ring-bar {
  stroke: url(#grad-emerald);
  filter: drop-shadow(0 4px 10px rgba(16,185,129,.35));
}
.dash-ring-card:nth-child(2) .dash-ring-bar {
  stroke: url(#grad-indigo);
  filter: drop-shadow(0 4px 10px rgba(99,102,241,.35));
}
.dash-ring-bar {
  transition: stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1);
}

.dash-ring-pct {
  font-size: 1.625rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.dash-ring-sub {
  font-size: 12px;
  letter-spacing: 0.06em;
}
.dash-ring-caption {
  font-size: 12.5px;
  color: var(--text-muted);
}

/* Metric tile stat cards */
.stat-head {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s2);
}
.stat-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  flex-shrink: 0;
}
.stat-icon[data-tone="indigo"] { background: var(--dash-indigo-bg); color: var(--dash-indigo); }
.stat-icon[data-tone="accent"] { background: var(--accent-soft); color: var(--accent); }
.stat-icon[data-tone="emerald"] { background: var(--dash-emerald-bg); color: var(--dash-emerald); }
.stat-icon[data-tone="rose"] { background: var(--dash-rose-bg); color: var(--dash-rose); }

.dash-stats {
  display: grid;
  gap: var(--s2);
  grid-template-columns: 1fr;
}
@media (min-width: 900px) {
  .dash-stats {
    grid-template-columns: 1fr;
  }
}
.dash-stats .card,
.stat-tile {
  border-left: 0;
  padding: var(--s3);
}
.dash-stats .card b,
.stat-tile b {
  font-size: 2.25rem;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.muted.stat-label {
  font-size: .6875rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
  color: var(--text-muted);
}
.stat-trend {
  font-size: .75rem;
  font-weight: 600;
  margin-top: 4px;
}
.stat-trend.is-up { color: var(--dash-emerald-fg); }
.stat-trend.is-down { color: var(--dash-rose-fg); }

/* --- ② PANEL "PERLU PERHATIAN" — Semantic Colors & Action Affordance --- */
.dash-attention {
  border-left: 0;
  padding: var(--s3);
}
summary.dash-attention-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--s2-5);
  gap: var(--s2);
  flex-wrap: wrap;
  cursor: pointer;
  list-style: none;
  user-select: none;
}
summary.dash-attention-head::-webkit-details-marker {
  display: none;
}
summary.dash-attention-head::after {
  content: "▾";
  font-size: 0.875rem;
  color: var(--text-muted);
  transition: transform var(--t-fast);
}
details.dash-attention:not([open]) summary.dash-attention-head::after {
  transform: rotate(-90deg);
}
details.dash-attention:not([open]) summary.dash-attention-head {
  margin-bottom: 0;
}
.dash-attention-head h3::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--dash-amber);
  margin-right: 10px;
  vertical-align: middle;
}

.dash-attention-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2-5) var(--s3);
  border-radius: var(--r-lg);
  border: 1px solid transparent;
}
.dash-attention-item.is-warn {
  background: color-mix(in srgb, var(--dash-amber-bg) 70%, var(--surface));
  border-color: color-mix(in srgb, var(--dash-amber) 30%, transparent);
}
.dash-attention-item.is-good {
  background: color-mix(in srgb, var(--dash-emerald-bg) 70%, var(--surface));
  border-color: color-mix(in srgb, var(--dash-emerald) 30%, transparent);
}
.dash-attention-item.is-info {
  background: color-mix(in srgb, var(--accent-soft) 70%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 25%, transparent);
}

.dash-att-marker {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
}
.is-warn .dash-att-marker { background: var(--dash-amber); color: #fff; }
.is-good .dash-att-marker { background: var(--dash-emerald); color: #fff; }
.is-info .dash-att-marker { background: var(--accent); color: #fff; }

.dash-att-badge {
  font-size: .6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 4px 8px;
  border-radius: var(--r-full);
  background: rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  .dash-att-badge {
    background: rgba(255,255,255,.08);
    color: var(--text);
  }
}

.dash-attention-item.is-clickable {
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.dash-attention-item.is-clickable:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-card);
}
.dash-attention-item.is-clickable:active {
  transform: translateY(0);
}
.dash-attention-item.is-clickable:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- ③ HEATMAP — Kontras Step Lebih Tegas --- */
.dash-heat-tbl th, .dash-heat-tbl td { border: 0; padding: 2px; }
.dash-heat-cell {
  border-radius: 6px;
  min-height: 38px;
  transition: transform .15s ease, filter .15s ease;
}
.dash-heat-tbl tbody tr:hover .dash-heat-cell { filter: brightness(.97); }
@media (prefers-color-scheme: dark) {
  .dash-heat-tbl tbody tr:hover .dash-heat-cell { filter: brightness(1.08); }
}
.dash-heat-cell:hover { transform: scale(1.03); z-index: 5; position: relative; }
.dash-heat-tbl tbody tr:has(th:hover) .dash-heat-cell {
  outline: 1px solid var(--accent);
}

.dash-heat-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s1);
  padding: var(--s2);
  background: var(--surface-2);
  border-radius: var(--r-full);
}
.dash-legend-item {
  padding: 4px 10px;
  border-radius: var(--r-full);
  background: var(--surface);
  font-size: .6875rem;
}

.dash-heat-cell.heat-1, .dash-legend-swatch.heat-1 { background:#e8f0ff; color:#1e3a8a; }
.dash-heat-cell.heat-2, .dash-legend-swatch.heat-2 { background:#c7dbfc; color:#1e3a8a; }
.dash-heat-cell.heat-3, .dash-legend-swatch.heat-3 { background:#9bbdf8; color:#0f172a; }
.dash-heat-cell.heat-4, .dash-legend-swatch.heat-4 { background:#6e9cf3; color:#0f172a; }
.dash-heat-cell.heat-5, .dash-legend-swatch.heat-5 { background:#3d6fe0; color:#ffffff; }

@media (prefers-color-scheme:dark) {
  .dash-heat-cell.heat-1, .dash-legend-swatch.heat-1 { background:#1a2333; color:#cbd5e1; }
  .dash-heat-cell.heat-2, .dash-legend-swatch.heat-2 { background:#213153; color:#dbeafe; }
  .dash-heat-cell.heat-3, .dash-legend-swatch.heat-3 { background:#2c4172; color:#e2e8f0; }
  .dash-heat-cell.heat-4, .dash-legend-swatch.heat-4 { background:#3e5a9a; color:#ffffff; }
  .dash-heat-cell.heat-5, .dash-legend-swatch.heat-5 { background:#4c6bb7; color:#ffffff; }
}

.dash-heat-cell.heat-low {
  outline: 2px solid var(--dash-rose);
  outline-offset: -2px;
  font-weight: 600;
}
.dash-heat-btn:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

/* --- ④ BAR CHART "Rata-rata per Mapel" --- */
.fill {
  background: linear-gradient(90deg, #60a5fa 0%, #2563eb 100%);
  border-radius: var(--r-full);
}
.fill.low {
  background: linear-gradient(90deg, #fb7185 0%, #e11d48 100%);
}
.bar .track {
  height: 10px;
  border-radius: var(--r-full);
  background: var(--dash-surface-2);
  border: 0;
}
.bar .fill {
  border-radius: var(--r-full);
}
.bar .kkm {
  background: var(--text);
  opacity: .55;
  width: 2px;
  border-radius: 2px;
  top: -3px;
  bottom: -3px;
  box-shadow: none;
}
.bar .kkm::after {
  content: "KKM";
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--text-muted);
}
.bar:not(:first-child) .kkm::after {
  display: none;
}
@media (prefers-color-scheme:dark) {
  .bar .kkm {
    background: #fff;
    opacity: .7;
  }
}
.bar {
  grid-template-columns: 8.5rem minmax(0,1fr) 3.75rem;
}
.bar:first-child {
  margin-top: 16px;
}
.bar > span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media (max-width: 440px) {
  .bar {
    grid-template-columns: 1fr auto;
  }
}

/* Animasi grow saat mount */
@keyframes grow-x { from { width: 0; } }
.fill { animation: grow-x 700ms cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow-y { from { height: 0; } }
.dash-vhist-fill { animation: grow-y 700ms cubic-bezier(.2,.8,.2,1) both; }

/* --- ⑤ HISTOGRAM "Sebaran Nilai" --- */
.dash-vhist-fill {
  background: linear-gradient(180deg, #6366f1 0%, #2563eb 100%);
  border-radius: 4px 4px 0 0;
}
.dash-vhist-track {
  background: var(--dash-surface-2);
  border: 0;
}
.dash-vhist-num {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
}
.dash-vhist-col:last-child .dash-vhist-fill {
  background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
}
.dash-vhist-col:nth-child(-n+2) .dash-vhist-fill {
  background: linear-gradient(180deg, #fb7185 0%, #e11d48 100%);
}

/* --- ⑥ TYPOGRAPHY HIERARCHY (global dashboard) --- */
.dash-hero h1,
.dash-hero h2,
.dash-hero h3,
.dash-attention h3,
.dash-heat-card h3,
.dash-vhist-fig h3,
.card h3 {
  letter-spacing: -0.015em;
}
.card h3 {
  font-size: 1.125rem;
  font-weight: 650;
}
.card h3 + p,
.card h3 + .muted,
.dash-attention-head p,
.dash-heat-header p {
  font-size: 0.8125rem;
  line-height: 1.5;
}

/* --- Bento Grid Dashboard (Layout v5) --- */
.dash-bento {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--s3);
  margin-top: var(--s4);
}
.dash-bento > .ring-card   { grid-column: span 3; }
.dash-bento > .stat-tile   { grid-column: span 2; }   /* 3 tile */
.dash-bento > .attention   { grid-column: span 6; }   /* full */
.dash-bento > .heatmap     { grid-column: span 4; }
.dash-bento > .histogram   { grid-column: span 2; }
.dash-bento > .barmapel    { grid-column: span 6; }

@media (max-width: 1100px) and (min-width: 901px) {
  .dash-bento > .heatmap     { grid-column: span 6; }
  .dash-bento > .barmapel    { grid-column: span 3; }
  .dash-bento > .histogram   { grid-column: span 3; }
}

@media (max-width: 900px) {
  .dash-bento { grid-template-columns: 1fr; }
  .dash-bento > * { grid-column: span 1 !important; }
  .dash-rings { grid-template-columns: 1fr; }
}

/* Stagger Animation FadeUp */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.dash-bento > * {
  animation: fadeUp 450ms cubic-bezier(.2,.8,.2,1) both;
}
.dash-bento > *:nth-child(1) { animation-delay: 0ms; }
.dash-bento > *:nth-child(2) { animation-delay: 60ms; }
.dash-bento > *:nth-child(3) { animation-delay: 120ms; }
.dash-bento > *:nth-child(4) { animation-delay: 180ms; }
.dash-bento > *:nth-child(5) { animation-delay: 240ms; }
.dash-bento > *:nth-child(6) { animation-delay: 300ms; }
.dash-bento > *:nth-child(7) { animation-delay: 360ms; }
.dash-bento > *:nth-child(8) { animation-delay: 420ms; }
.dash-bento > *:nth-child(9) { animation-delay: 480ms; }

@starting-style {
  .dash-ring-bar {
    stroke-dashoffset: 276.46;
  }
}

@media (max-width: 600px) {
  .dash-ring-box { width: 88px; height: 88px; }
  .dash-ring-svg { width: 88px; height: 88px; }
  .dash-ring-pct { font-size: 1.35rem; }

  .dash-attention-list { gap: var(--s1); }
  .dash-attention-item { padding: var(--s2); }
  .dash-att-badge { display: none; }

  /* Heatmap mobile compact */
  .dash-heat-tbl th,
  .dash-heat-tbl td,
  .dash-heat-cell,
  .dash-heat-btn {
    font-size: 0.75rem;
  }
  .dash-heat-cell {
    min-width: 3rem;
    min-height: 32px;
    padding: 1px 2px;
  }
  .dash-th-mapel,
  .dash-heat-tbl th:nth-child(2),
  .dash-heat-tbl td:nth-child(2) {
    min-width: 3rem;
  }
  .dash-th-corner,
  .dash-th-kelas {
    min-width: 4.5rem;
  }
}

/* --- ⑦ MICRO-INTERACTIONS --- */
.dash-hero .card,
.dash-bento > .card,
.dash-attention,
.dash-heat-card {
  transition: box-shadow 220ms ease, border-color 220ms ease;
}
@media (hover: hover) {
  .dash-hero .card:hover,
  .dash-bento > .card:hover,
  .dash-heat-card:hover {
    box-shadow: 0 4px 12px -2px rgba(15,23,42,.08), 0 2px 6px -2px rgba(15,23,42,.05);
  }
}
@media (hover: hover) and (prefers-color-scheme: dark) {
  .dash-hero .card:hover,
  .dash-bento > .card:hover,
  .dash-heat-card:hover {
    box-shadow: 0 4px 12px -2px rgba(0,0,0,.5);
  }
}

@keyframes dashFadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.dash-ring-pct, .dash-ring-sub, .dash-ring-caption {
  animation: dashFadeIn 500ms ease-out both;
}

@media (prefers-reduced-motion: reduce) {
  .dash-bento > *, .dash-ring-bar, .dash-ring-pct, .dash-ring-sub, .dash-ring-caption, .fill, .dash-vhist-fill {
    animation: none !important;
    transition: none !important;
  }
}

/* ===== MAPEL VIEW v4 ===== */
/* Status badge di tabel */
.mp-status {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--r-full);
  font: var(--font-micro); font-weight: 600;
  white-space: nowrap;
}
.mp-status.is-tuntas { background: var(--dash-emerald-bg); color: var(--dash-emerald-fg); }
.mp-status.is-belum  { background: var(--dash-rose-bg);    color: var(--dash-rose-fg); }

/* Baris di bawah KKM */
.tw > table tbody tr.mp-row-below td,
.tw > table tbody tr.mp-row-below td:first-child,
.tw > table tbody tr.mp-row-below td:nth-child(2) {
  background: color-mix(in srgb, var(--dash-rose-bg) 40%, var(--surface));
}

/* Histogram khusus mapel */
.mp-histogram .dash-vhist-col:nth-child(-n+4) .dash-vhist-fill {
  background: linear-gradient(180deg, var(--dash-rose) 0%, #be123c 100%);
}
.mp-histogram .dash-vhist-col:nth-child(n+5) .dash-vhist-fill {
  background: linear-gradient(180deg, var(--dash-emerald) 0%, #047857 100%);
}
@media (prefers-color-scheme: dark) {
  .mp-histogram .dash-vhist-col:nth-child(-n+4) .dash-vhist-fill {
    background: linear-gradient(180deg, var(--dash-rose) 0%, #881337 100%);
  }
  .mp-histogram .dash-vhist-col:nth-child(n+5) .dash-vhist-fill {
    background: linear-gradient(180deg, var(--dash-emerald) 0%, #064e3b 100%);
  }
}

/* Ketuntasan per kelas */
.mp-perkelas-list { display: flex; flex-direction: column; gap: var(--s2); }
.mp-perkelas-row {
  display: grid;
  grid-template-columns: 4.5rem 1fr auto;
  gap: var(--s2); align-items: center;
  font: var(--font-caption);
}
.mp-perkelas-track {
  height: 10px; background: var(--dash-surface-2);
  border-radius: var(--r-full); overflow: hidden;
}
.mp-perkelas-fill {
  height: 100%; border-radius: var(--r-full);
  transition: width var(--t-normal);
}
.mp-perkelas-fill.is-good    { background: var(--dash-emerald); }
.mp-perkelas-fill.is-warning { background: var(--dash-amber); }
.mp-perkelas-fill.is-low     { background: var(--dash-rose); }
.mp-perkelas-count {
  font: var(--font-micro); color: var(--text-muted);
  font-variant-numeric: tabular-nums; text-align: right;
}

/* Zona Remedial */
.mp-remedial-head {
  display: flex; align-items: baseline; gap: var(--s2);
  justify-content: space-between; margin-bottom: var(--s3);
  flex-wrap: wrap;
}
.mp-remedial-count {
  font: var(--font-micro); color: var(--text-muted);
  background: var(--dash-surface-2); padding: 2px 8px;
  border-radius: var(--r-full);
}
.mp-remedial-list {
  display: flex; flex-direction: column; gap: var(--s1-5, 6px);
  max-height: 22rem; overflow-y: auto; padding-right: 4px;
}
.mp-remedial-item {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: var(--s2); align-items: center;
  padding: var(--s2) var(--s3);
  border-radius: var(--r-md);
  border-left: 3px solid transparent;
  background: var(--dash-surface-2);
  font: var(--font-caption);
}
.mp-remedial-item .mp-rm-name {
  font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mp-remedial-item .mp-rm-kelas { color: var(--text-muted); font-size: 0.75rem; }
.mp-remedial-item .mp-rm-nilai {
  font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--dash-rose-fg);
}
.mp-remedial-item .mp-rm-gap {
  font: var(--font-micro); color: var(--dash-rose-fg);
  font-variant-numeric: tabular-nums;
}
.mp-remedial-item.is-hampir    { border-left-color: var(--dash-amber); }
.mp-remedial-item.is-bimbingan { border-left-color: var(--dash-amber); }

<body>
<main id="app"></main>
<script>
"use strict";
/* ===== Konfigurasi ===== */
const API_URL = "https://script.google.com/macros/s/AKfycby7hXngXJgR5IOajI-nUy-s-fd6IbnGR1YY9tro_Gb0w-rieewaOF37OLoKUpgYdiY/exec";
const KKM = 75;
const API_TIMEOUT_MS = 25000;
const REFRESH_COOLDOWN_S = 30;
const URL_REVOKE_DELAY_MS = 60000;
const SESSION_KEY = "rn_session", DATA_KEY = "rn_data";
const LABELS = { INFORMATIKA: "Informatika" };
const BINS = [[0, "0–49"], [50, "50–59"], [60, "60–69"], [70, "70–79"], [80, "80–89"], [90, "90–100"]];

/* ===== Util ===== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label = m => LABELS[m] || m;
const fmt = n => n == null ? "–" : (Math.round(n * 10) / 10).toLocaleString("id-ID");
const natural = (a, b) => a.localeCompare(b, "id", { numeric: true });
const store = {
  get: k => { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* penyimpanan penuh/ditolak: abaikan */ } },
  del: k => { try { sessionStorage.removeItem(k); } catch { /* abaikan */ } },
};

/* ===== API ===== */
async function api(payload) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), API_TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload), signal: ctl.signal });
    const json = await res.json();
    if (!json.ok) throw Object.assign(new Error(json.message), { code: json.code });
    return json;
  } catch (e) {
    if (e.code) throw e;
    throw Object.assign(new Error(e.name === "AbortError" ? "Server terlalu lama merespons. Coba lagi." : "Tidak dapat terhubung. Periksa koneksi internet."), { code: "NETWORK" });
  } finally { clearTimeout(timer); }
}

/* ===== Statistik (fungsi murni) ===== */
const valid = v => typeof v === "number" && Number.isFinite(v);
const avg = xs => { const v = xs.filter(valid); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const tingkat = k => String(k).split(".")[0];
function summary(d) {
  const all = d.siswa.flatMap(s => s.nilai).filter(valid);
  return { siswa: d.siswa.length, kelas: new Set(d.siswa.map(s => s.kelas)).size, rata: avg(all), tuntas: all.length ? all.filter(v => v >= KKM).length / all.length * 100 : null };
}
const avgByMapel = d => d.mapel.map((m, i) => ({ id: i, label: label(m), value: avg(d.siswa.map(s => s.nilai[i])) })).sort((a, b) => a.value == null && b.value == null ? 0 : a.value == null ? 1 : b.value == null ? -1 : a.value - b.value);
function avgByKelas(d, t) {
  const g = {};
  d.siswa.filter(s => !t || tingkat(s.kelas) === t).forEach(s => (g[s.kelas] ??= []).push(avg(s.nilai)));
  return Object.keys(g).sort(natural).map(k => ({ label: "Kelas " + k, value: avg(g[k]) }));
}
const median = xs => {
  const v = xs.filter(valid).sort((a,b)=>a-b);
  if (!v.length) return null;
  const m = Math.floor(v.length/2);
  return v.length % 2 ? v[m] : (v[m-1]+v[m])/2;
};

const passRate = (vals, kkm = KKM) => {
  const v = vals.filter(valid);
  return v.length ? v.filter(x => x >= kkm).length / v.length * 100 : null;
};

// Bins: [0-49][50-59][60-69][70-74][75-84][85-100]
const BINS_MAPEL = [
  [0, "0–49", false], [50, "50–59", false], [60, "60–69", false],
  [70, "70–74", false], [75, "75–84", true], [85, "85–100", true]
];

const distributionFor = vals => {
  const v = vals.filter(valid);
  return BINS_MAPEL.map(([from, text], i) => {
    const to = i + 1 < BINS_MAPEL.length ? BINS_MAPEL[i+1][0] : Infinity;
    return {
      label: text,
      value: v.filter(x => x >= from && x < to).length,
      aboveKkm: BINS_MAPEL[i][2]
    };
  });
};

const perClassTuntas = (d, mapelIdx) => {
  const g = {};
  d.siswa.forEach(s => {
    (g[s.kelas] ??= []).push(s.nilai[mapelIdx]);
  });
  return Object.keys(g).sort(natural).map(k => {
    const v = g[k].filter(valid);
    const tuntas = v.filter(x => x >= KKM).length;
    return {
      kelas: k,
      tuntas,
      total: v.length,
      pct: v.length ? tuntas / v.length * 100 : null
    };
  }).filter(x => x.total > 0);
};

const remedialList = (d, mapelIdx) => {
  return d.siswa
    .filter(s => valid(s.nilai[mapelIdx]) && s.nilai[mapelIdx] < KKM)
    .map(s => ({
      nama: s.nama,
      kelas: s.kelas,
      nilai: s.nilai[mapelIdx],
      gap: s.nilai[mapelIdx] - KKM
    }))
    .sort((a, b) => b.nilai - a.nilai); // paling dekat KKM dulu
};

const priorityOf = gap => {
  if (gap >= -5) return { key: "hampir", label: "⚡ Hampir", cls: "is-hampir" };
  if (gap >= -15) return { key: "bimbingan", label: "🔶 Bimbingan", cls: "is-bimbingan" };
  return { key: "kritis", label: "🔥 Kritis", cls: "is-kritis" };
};
const distribution = d => {
  const all = d.siswa.flatMap(s => s.nilai).filter(valid);
  return BINS.map(([from, text], i) => {
    const to = i + 1 < BINS.length ? BINS[i + 1][0] : Infinity;
    return { label: text, value: all.filter(v => v >= from && v < to).length };
  });
};
function kelengkapan(d) {
  if (!d || !d.siswa || !d.siswa.length || !d.mapel || !d.mapel.length) {
    return { total: 0, terisi: 0, kosong: 0, pct: null, mapelKosong: [] };
  }
  const islamIdxs = [];
  const kristenIdxs = [];
  const relIdxs = [];
  d.mapel.forEach((m, idx) => {
    const lbl = label(m);
    if (/islam|pai\b|paibp/i.test(lbl)) islamIdxs.push(idx);
    if (/kristen|katolik|pak\b|pakbp/i.test(lbl)) kristenIdxs.push(idx);
    if (/agama|kepercayaan/i.test(lbl)) relIdxs.push(idx);
  });

  const isWajib = (s, j) => {
    if (valid(s.nilai[j])) return true;
    if (kristenIdxs.includes(j)) {
      if (islamIdxs.some(k => valid(s.nilai[k]))) return false;
    }
    if (islamIdxs.includes(j)) {
      if (kristenIdxs.some(k => valid(s.nilai[k]))) return false;
    }
    if (relIdxs.includes(j)) {
      if (relIdxs.some(k => k !== j && valid(s.nilai[k]))) return false;
    }
    return true;
  };

  let total = 0;
  let terisi = 0;
  const missingCounts = new Uint32Array(d.mapel.length);

  for (let i = 0; i < d.siswa.length; i++) {
    const s = d.siswa[i];
    const vals = s.nilai;
    for (let j = 0; j < d.mapel.length; j++) {
      if (isWajib(s, j)) {
        total++;
        if (valid(vals[j])) {
          terisi++;
        } else {
          missingCounts[j]++;
        }
      }
    }
  }

  const kosong = total - terisi;
  const pct = total > 0 ? (terisi / total * 100) : null;
  const mapelKosong = d.mapel.map((m, j) => ({
    label: label(m),
    count: missingCounts[j]
  })).filter(m => m.count > 0).sort((a, b) => b.count - a.count);

  return { total, terisi, kosong, pct, mapelKosong };
}

/* ===== Ekspor .xlsx (tanpa library) ===== */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zipStore(files) {
  const te = new TextEncoder(), parts = [], cen = []; let off = 0;
  for (const [name, text] of files) {
    const nb = te.encode(name), d = te.encode(text), c = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, d);
    const k = new DataView(new ArrayBuffer(46));
    k.setUint32(0, 0x02014b50, true); k.setUint16(4, 20, true); k.setUint16(6, 20, true); k.setUint16(8, 0x800, true); k.setUint16(14, 0x21, true);
    k.setUint32(16, c, true); k.setUint32(20, d.length, true); k.setUint32(24, d.length, true); k.setUint16(28, nb.length, true); k.setUint32(42, off, true);
    cen.push(new Uint8Array(k.buffer), nb); off += 30 + nb.length + d.length;
  }
  const size = cen.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
const colName = i => (i >= 26 ? colName(Math.floor(i / 26) - 1) : "") + String.fromCharCode(65 + i % 26);
function downloadXlsx(rows, fileName) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const sheet = rows.map((r, i) => `<row r="${i + 1}">` + r.map((v, j) => {
    const ref = colName(j) + (i + 1);
    if (v == null || v === "") return "";
    return valid(v) ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t>${x(v)}</t></is></c>`;
  }).join("") + "</row>").join("");
  const ns = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"', head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const blob = zipStore([
    ["[Content_Types].xml", `${head}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`],
    ["_rels/.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `${head}<workbook ${ns} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Nilai" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml", `${head}<worksheet ${ns}><sheetData>${sheet}</sheetData></worksheet>`],
  ]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.hidden = true;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), URL_REVOKE_DELAY_MS);
}

/* ===== State ===== */
const S = { sess: store.get(SESSION_KEY), data: null, view: "dashboard", kelas: "", mapel: 0, mapelKelas: "", q: "", tg: "", setupToken: "", nama: "", error: "", loading: false, cooldown: 0 };

/* ===== Komponen tampilan ===== */
const bars = items => items.map(i => `<div class="bar"><span>${esc(i.label)}</span><div class="track" role="meter" aria-valuenow="${i.value ?? 0}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(i.label)}: ${fmt(i.value)}"><div class="fill${i.value != null && i.value < KKM ? ' low' : ''}" style="width:${Math.min(100, i.value || 0)}%"></div><div class="kkm" style="left:${KKM}%" title="KKM ${KKM}"></div></div><span>${cell(i.value)}</span></div>`).join("");
function hist(items) {
  const max = Math.max(1, ...items.map(i => i.value));
  return items.map(i => `<div class="bar"><span>${esc(i.label)}</span><div class="track" role="meter" aria-valuenow="${i.value}" aria-valuemin="0" aria-valuemax="${max}" aria-label="${esc(i.label)}: ${i.value}"><div class="fill" style="width:${i.value / max * 100}%"></div></div><span>${i.value}</span></div>`).join("");
}
const cell = v => v == null ? "–" : v < KKM ? `<span class="low" title="Di bawah KKM">▼ ${fmt(v)}</span>` : fmt(v);
const chunkHead = cols => `<thead><tr><th scope="col">No</th><th scope="col">Nama</th>${cols.map(c => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead>`;
const options = (list, sel, all) => (all ? `<option value="">${all}</option>` : "") + list.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(sel) ? " selected" : ""}>${esc(t)}</option>`).join("");
const kelasList = d => [...new Set(d.siswa.map(s => s.kelas))].sort(natural);

/* ===== Layar ===== */
const MAPEL_SHORT = {
  "Agama Islam": "PAI",
  "Pendidikan Agama Islam": "PAI",
  "Agama Kristen": "PAK",
  "Pendidikan Agama Kristen": "PAK",
  "Agama Katolik": "Katolik",
  "Pendidikan Pancasila": "PPKn",
  "Bahasa Indonesia": "B. Indo",
  "Bahasa Daerah": "B. Daerah",
  "Bahasa Inggris": "B. Ingg",
  "Matematika": "Mat",
  "Informatika": "Info",
  "Seni Budaya": "Seni",
  "Prakarya": "Prakarya",
  "IPA": "IPA",
  "IPS": "IPS",
  "PJOK": "PJOK"
};
const shortLabel = m => {
  const lbl = label(m);
  return MAPEL_SHORT[lbl] || (lbl.length > 8 ? lbl.slice(0, 7) + "…" : lbl);
};

function insights(d) {
  if (!d || !d.siswa || !d.siswa.length || !d.mapel || !d.mapel.length) {
    return [{ type: "info", text: "Belum ada data nilai yang cukup untuk dianalisis." }];
  }
  const kl = kelengkapan(d);
  if (!kl.terisi) {
    return [{ type: "info", text: "Belum ada nilai yang dimasukkan ke spreadsheet." }];
  }

  const mapelAvgs = d.mapel.map((m, i) => {
    const scores = d.siswa.map(s => s.nilai[i]).filter(valid);
    return { id: i, label: label(m), avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null };
  }).filter(m => m.avg !== null);

  const kList = kelasList(d);
  const kelasAvgs = kList.map(k => {
    const scores = d.siswa.filter(s => s.kelas === k).flatMap(s => s.nilai).filter(valid);
    return { kelas: k, avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null };
  }).filter(k => k.avg !== null);

  const belowMapel = mapelAvgs.filter(m => m.avg < KKM);
  const sortedMapel = [...mapelAvgs].sort((a, b) => a.avg - b.avg);
  const sortedKelas = [...kelasAvgs].sort((a, b) => a.avg - b.avg);
  const res = [];

  // 1. Peringatan kelengkapan pengisian nilai bila ada nilai kosong
  if (kl.kosong > 0 && kl.mapelKosong.length > 0) {
    res.push({
      type: "warn",
      text: `${kl.kosong} nilai belum diinput (${kl.mapelKosong[0].label} terbanyak: ${kl.mapelKosong[0].count} siswa belum dinilai).`,
      act: "nav-mapel",
      mapel: kl.mapelKosong[0].id,
      badge: "Cek Mapel"
    });
  }

  // 2. Mapel dengan rata-rata terendah di bawah KKM
  if (sortedMapel.length && sortedMapel[0].avg < KKM) {
    res.push({
      type: "warn",
      text: `Mata pelajaran ${sortedMapel[0].label} memiliki rata-rata terendah (${fmt(sortedMapel[0].avg)}), di bawah KKM ${KKM}.`,
      act: "nav-mapel",
      mapel: sortedMapel[0].id,
      badge: "Buka Mapel"
    });
  }

  // 3. Jumlah mapel di bawah KKM bila > 1
  if (belowMapel.length > 1 && res.length < 3) {
    res.push({
      type: "warn",
      text: `Terdapat ${belowMapel.length} dari ${mapelAvgs.length} mata pelajaran dengan rata-rata di bawah KKM ${KKM}.`,
      act: "nav-mapel",
      mapel: belowMapel[0].id,
      badge: "Cek Mapel"
    });
  } else if (belowMapel.length === 1 && !res.some(r => r.text.includes(belowMapel[0].label)) && res.length < 3) {
    res.push({
      type: "warn",
      text: `Mata pelajaran ${belowMapel[0].label} adalah satu-satunya mapel di bawah KKM (${fmt(belowMapel[0].avg)}).`,
      act: "nav-mapel",
      mapel: belowMapel[0].id,
      badge: "Buka Mapel"
    });
  }

  // 4. Kelas dengan rata-rata terendah
  if (sortedKelas.length && res.length < 3) {
    const lowestK = sortedKelas[0];
    if (lowestK.avg < KKM) {
      res.push({
        type: "warn",
        text: `Kelas ${lowestK.kelas} perlu perhatian khusus dengan rata-rata ${fmt(lowestK.avg)} (di bawah KKM ${KKM}).`,
        act: "nav-kelas",
        kelas: lowestK.kelas,
        badge: "Buka Kelas"
      });
    } else if (res.length < 2 && sortedKelas.length > 1) {
      res.push({
        type: "info",
        text: `Kelas dengan rata-rata terendah saat ini adalah Kelas ${lowestK.kelas} (${fmt(lowestK.avg)}).`,
        act: "nav-kelas",
        kelas: lowestK.kelas,
        badge: "Lihat Kelas"
      });
    }
  }

  if (res.length === 0) {
    res.push({
      type: "good",
      text: `Seluruh data nilai lengkap (100%) dan seluruh mata pelajaran telah mencapai atau melampaui KKM ${KKM}.`,
      badge: "Optimal"
    });
  }

  return res.slice(0, 3);
}

function matrixAgg(d, tg) {
  const ks = kelasList(d).filter(k => !tg || tingkat(k) === tg);
  const kIndex = {};
  for (let i = 0; i < ks.length; i++) kIndex[ks[i]] = i;
  const nMapel = d.mapel.length;
  const sums = Array.from({ length: ks.length }, () => new Float64Array(nMapel));
  const counts = Array.from({ length: ks.length }, () => new Uint16Array(nMapel));

  for (let i = 0; i < d.siswa.length; i++) {
    const s = d.siswa[i];
    const r = kIndex[s.kelas];
    if (r === undefined) continue;
    const vals = s.nilai;
    for (let j = 0; j < nMapel; j++) {
      const v = vals[j];
      if (typeof v === "number" && Number.isFinite(v)) {
        sums[r][j] += v;
        counts[r][j]++;
      }
    }
  }

  return ks.map((k, r) => ({
    kelas: k,
    mapelAvgs: Array.from({ length: nMapel }, (_, c) => counts[r][c] > 0 ? sums[r][c] / counts[r][c] : null)
  }));
}

function heatLevel(v) {
  if (v == null) return 0;
  if (v < 65) return 1;
  if (v < 75) return 2;
  if (v < 80) return 3;
  if (v < 88) return 4;
  return 5;
}

function heatCell(v) {
  if (v == null) return `<td class="dash-heat-cell heat-none" title="Belum ada data nilai diinput" aria-label="Belum ada data">–</td>`;
  const lvl = heatLevel(v);
  const isLow = v < KKM;
  const content = isLow ? `<span class="dash-low-marker" aria-hidden="true">▼</span>${fmt(v)}` : fmt(v);
  const title = `${isLow ? 'Di bawah KKM: ' : ''}${fmt(v)}`;
  const aria = `${fmt(v)}${isLow ? ', di bawah KKM' : ''}`;
  return `<td class="dash-heat-cell heat-${lvl}${isLow ? ' heat-low' : ''}" title="${esc(title)}" aria-label="${esc(aria)}">${content}</td>`;
}

function vhist(items) {
  const total = items.reduce((a, b) => a + b.value, 0);
  const max = Math.max(1, ...items.map(i => i.value));
  return `<figure class="dash-vhist-fig" role="group" aria-label="Grafik sebaran nilai">
    <figcaption class="sr-only">Sebaran nilai siswa: ${items.map(i => `${i.label} ada ${i.value} nilai (${total ? Math.round(i.value / total * 100) : 0}%)`).join(", ")}</figcaption>
    <div class="dash-vhist" aria-hidden="true">
      ${items.map(i => {
        const pct = total ? (i.value / total * 100) : 0;
        const pctStr = total ? (Math.round(pct * 10) / 10).toLocaleString("id-ID") + "%" : "0%";
        const h = max ? Math.round(i.value / max * 100) : 0;
        return `<div class="dash-vhist-col">
          <div class="dash-vhist-stat">
            <b class="dash-vhist-num">${i.value}</b>
            <span class="dash-vhist-pct">${pctStr}</span>
          </div>
          <div class="dash-vhist-track">
            <div class="dash-vhist-fill" style="height:${h}%"></div>
          </div>
          <span class="dash-vhist-lbl">${esc(i.label)}</span>
        </div>`;
      }).join("")}
    </div>
  </figure>`;
}

function kelasRows() {
  const d = S.data, q = S.q.trim().toLowerCase();
  return d.siswa.filter(s => s.kelas === S.kelas && (!q || s.nama.toLowerCase().includes(q) || s.no_urut.includes(q)));
}
function viewKelas() {
  const d = S.data, rows = kelasRows();
  return `<div class="row"><div><label for="kelas">Kelas</label><select id="kelas">${options(kelasList(d).map(k => [k, "Kelas " + k]), S.kelas)}</select></div>
    <div><label for="q">Cari siswa</label><input id="q" type="search" value="${esc(S.q)}" placeholder="Nama atau nomor"></div>
    <button data-act="export-kelas">Unduh .xlsx</button></div>
  ${rows.length ? `<p class="muted scroll-hint" style="font-size:0.75rem; margin-bottom:var(--s1)">&larr; Geser tabel ke kanan untuk melihat seluruh mapel &rarr;</p>
  <div class="tw"><table>${chunkHead(d.mapel.map(label).concat("Rata-rata"))}<tbody>${rows.map(s => `<tr><td>${esc(s.no_urut)}</td><td scope="row" title="${esc(s.nama)}">${esc(s.nama)}</td>${s.nilai.map(v => `<td>${cell(v)}</td>`).join("")}<td><b>${cell(avg(s.nilai))}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td></td><td>Rata-rata kelas</td>${d.mapel.map((_, i) => `<td>${fmt(avg(rows.map(s => s.nilai[i])))}</td>`).join("")}<td>${fmt(avg(rows.map(s => avg(s.nilai))))}</td></tr></tfoot></table></div>` : `<div class="card empty">Tidak ada siswa yang cocok.</div>`}`;
}
function mapelRows() {
  const i = S.mapel;
  return S.data.siswa.filter(s => !S.mapelKelas || s.kelas === S.mapelKelas).filter(s => valid(s.nilai[i])).sort((a, b) => b.nilai[i] - a.nilai[i]);
}
function viewMapel() {
  const d = S.data, i = S.mapel, rows = mapelRows();
  const vals = rows.map(s => s.nilai[i]);
  const below = vals.filter(v => v < KKM).length;
  const pRate = passRate(vals);
  const med = median(vals);

  const pkList = perClassTuntas(d, i).filter(c => !S.mapelKelas || c.kelas === S.mapelKelas);
  const remList = remedialList(d, i).filter(s => !S.mapelKelas || s.kelas === S.mapelKelas);

  return `<div class="row"><div><label for="mapel">Mata pelajaran</label><select id="mapel">${options(d.mapel.map((m, k) => [k, label(m)]), i)}</select></div>

    ["Rata-rata", fmt(avg(vals))],

    ["Terendah", vals.length ? fmt(Math.min(...vals)) : "–"],

      ` : `<div class="empty">Belum ada data nilai kelas.</div>`}

  </div>
  <section class="card mp-table" style="margin-bottom:var(--s3); padding:0; overflow:hidden">
    <div style="padding:var(--s3) var(--s3) var(--s2)">
      <h3 id="mp-tbl-title">Daftar Nilai Siswa</h3>

      <div class="tw" style="border:0">

          <thead>
            <tr>
              <th scope="col" style="width:3rem">#</th>
              <th scope="col">Nama</th>
              <th scope="col" style="text-align:center">Kelas</th>
              <th scope="col">Nilai</th>
              <th scope="col" style="text-align:center">Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((s, n) => {
              const val = s.nilai[i];
              const isTuntas = val >= KKM;
              const rowCls = isTuntas ? "" : ' class="mp-row-below"';
              const statusHtml = isTuntas
                ? `<span class="mp-status is-tuntas">✓ Tuntas</span>`
                : `<span class="mp-status is-belum">✕ Belum</span>`;
              return `<tr${rowCls}>
                <td>${n + 1}</td>
                <td scope="row" title="${esc(s.nama)}">${esc(s.nama)}</td>

  <section class="card mp-remedial" aria-labelledby="mp-rm-title">
    <div class="mp-remedial-head">

      <div class="mp-remedial-list" role="list" aria-label="Daftar siswa remedial">

      </div>
    ` : `<div class="empty">Tidak ada siswa di bawah KKM 🎉</div>`}
  </section>`;
}

  const body = S.loading && !S.data ? `<div class="grid stats"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>` : S.data ? (S.data.siswa.length ? VIEWS[S.view][1]() : `<div class="card empty">Belum ada data siswa di spreadsheet.</div>`) : "";
  return `<header class="top"><div class="wrap"><h1 style="font-size:1.125rem; font-weight:700; margin:0">Rekap Nilai</h1>
    <nav class="bottom-nav" aria-label="Menu utama">${Object.entries(VIEWS).map(([k, [t]]) => `<button data-view="${k}"${k === S.view ? ' aria-current="page"' : ""}>${t}</button>`).join("")}</nav>
    <div style="display:flex;gap:var(--s2)"><button data-act="refresh"${S.loading || S.cooldown ? " disabled" : ""}>${S.loading ? "Memuat…" : S.cooldown ? `Segarkan (${S.cooldown})` : "Segarkan"}</button><button class="subtle" data-act="logout">Keluar</button></div></div></header>
  <div class="wrap" aria-busy="${S.loading}">${S.error ? `<div class="banner" role="alert"><span>${esc(S.error)}</span><button data-act="retry">Coba lagi</button></div>` : ""}${body}</div>`;
}

/* ===== Render ===== */
function render() {
  const keep = document.activeElement && document.activeElement.id;
  const pos = document.activeElement && document.activeElement.selectionStart;
  $("#app").innerHTML = S.sess ? viewApp() : viewLogin();
  const el = keep && document.getElementById(keep);
  if (el) { el.focus(); if (pos != null && el.setSelectionRange && el.type === "search") el.setSelectionRange(pos, pos); }
  if (typeof requestAnimationFrame !== "undefined") {
    requestAnimationFrame(() => {
      document.querySelectorAll(".dash-ring-bar[data-offset]").forEach(bar => {
        bar.style.strokeDashoffset = bar.dataset.offset;
      });
    });
  }
}

/* ===== Aksi ===== */
function logout(msg = "") {
  S.sess = null; S.data = null; S.setupToken = ""; S.error = msg;
  store.del(SESSION_KEY); store.del(DATA_KEY); render();
}
function startSession(r) {
  S.sess = { token: r.token, nama: r.guru.nama, exp: r.expiresAt }; store.set(SESSION_KEY, S.sess);
  S.setupToken = ""; S.error = ""; loadData(false);
}
async function loadData(force) {
  if (!S.sess) return;
  const cached = store.get(DATA_KEY);
  if (cached && !S.data) { S.data = cached.data; initSelections(); }
  S.loading = true; S.error = ""; render();
  try {
    const r = await api({ action: "data", token: S.sess.token, since: cached ? cached.version : "", force });
    if (r.unchanged) { if (!S.data && cached) S.data = cached.data; }
    else { S.data = { mapel: r.mapel, siswa: r.siswa }; store.set(DATA_KEY, { version: r.version, data: S.data }); }
    initSelections();
  } catch (e) {
    if (e.code === "SESSION_EXPIRED") return logout(e.message);
    S.error = e.message + (S.data ? " Menampilkan data terakhir." : "");
  } finally { S.loading = false; render(); }
}
function initSelections() {
  const ks = kelasList(S.data);
  if (!ks.includes(S.kelas)) S.kelas = ks[0] || "";
  if (S.mapel >= S.data.mapel.length) S.mapel = 0;
}
function startCooldown() {
  S.cooldown = REFRESH_COOLDOWN_S;
  const t = setInterval(() => { S.cooldown--; if (S.cooldown <= 0) clearInterval(t); render(); }, 1000);
}
function exportRows(kind) {
  const d = S.data, head = ["Kelas", "No", "Nama", ...d.mapel.map(label)];
  if (kind === "kelas") return [["No", "Nama", ...d.mapel.map(label), "Rata-rata"], ...kelasRows().map(s => [s.no_urut, s.nama, ...s.nilai, avg(s.nilai)])];
  if (kind === "mapel") return [["No", "Nama", "Kelas", label(d.mapel[S.mapel])], ...mapelRows().map((s, n) => [n + 1, s.nama, s.kelas, s.nilai[S.mapel]])];
  return [head, ...d.siswa.map(s => [s.kelas, s.no_urut, s.nama, ...s.nilai])];
}
const safeName = t => t.replace(/[^\w.-]+/g, "_");

/* ===== Event ===== */
document.addEventListener("submit", async e => {
  if (e.target.id !== "f-login") return;
  e.preventDefault();
  const btn = e.target.querySelector("button"), v = id => (document.getElementById(id)?.value || "").trim();
  S.error = "";
  try {
    if (S.setupToken) {
      if (!/^\d{6}$/.test(v("pin"))) throw new Error("PIN harus terdiri dari 6 angka.");
      if (v("pin") !== v("pin2")) throw new Error("Kedua PIN tidak sama.");
    } else if (!/^\d{8,20}$/.test(v("nip").replace(/\s+/g, "")) || !v("secret")) throw new Error("Isi NIP (angka) dan PIN/kode aktivasi.");
    btn.disabled = true; btn.textContent = "Memproses…";
    const r = S.setupToken ? await api({ action: "setPin", setupToken: S.setupToken, pin: v("pin") })
                           : await api({ action: "login", nip: v("nip").replace(/\s+/g, ""), secret: v("secret") });
    if (r.needsPin) { S.setupToken = r.setupToken; S.nama = r.nama; render(); $("#pin").focus(); return; }
    startSession(r);
  } catch (err) {
    if (err.code === "SESSION_EXPIRED") S.setupToken = "";
    S.error = err.message; render();
  }
});
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]"), a = e.target.closest("[data-act]");
  if (v) { S.view = v.dataset.view; render(); return; }
  if (!a) return;
  const act = a.dataset.act, d = S.data;
  if (act === "nav-kelas") {
    S.view = "kelas";
    S.kelas = a.dataset.kelas;
    render();
  }
  else if (act === "nav-mapel") {
    S.view = "mapel";
    S.mapel = Number(a.dataset.mapel);
    S.mapelKelas = "";
    render();
  }
  else if (act === "logout") {
    if (window.confirm("Apakah Anda yakin ingin keluar dari aplikasi?")) logout();
  }
  else if (act === "retry") loadData(false);
  else if (act === "refresh") { startCooldown(); loadData(true); }
  else if (d && act.startsWith("export-")) {
    const kind = act.slice(7), name = kind === "kelas" ? "Kelas_" + S.kelas : kind === "mapel" ? label(d.mapel[S.mapel]) : "Semua_Nilai";
    downloadXlsx(exportRows(kind), safeName("Nilai_" + name) + ".xlsx");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const act = e.target.closest?.("[data-act][role='button']");
    if (act) { e.preventDefault(); act.click(); }
  }
});
document.addEventListener("change", e => {
  const m = { kelas: v => S.kelas = v, mapel: v => S.mapel = Number(v), mk: v => S.mapelKelas = v, tg: v => S.tg = v }[e.target.id];
  if (m) { m(e.target.value); render(); }
});
let searchTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      S.q = e.target.value;
      const d = S.data;
      if (!d) return;
      const rows = kelasRows();
      const tbody = document.querySelector(".tw tbody");
      const tfoot = document.querySelector(".tw tfoot");
      if (tbody && rows.length) {
        tbody.innerHTML = rows.map(s => `<tr><td>${esc(s.no_urut)}</td><td scope="row" title="${esc(s.nama)}">${esc(s.nama)}</td>${s.nilai.map(v => `<td>${cell(v)}</td>`).join("")}<td><b>${cell(avg(s.nilai))}</b></td></tr>`).join("");
        if (tfoot) tfoot.innerHTML = `<tr><td></td><td>Rata-rata kelas</td>${d.mapel.map((_, i) => `<td>${fmt(avg(rows.map(s => s.nilai[i])))}</td>`).join("")}<td>${fmt(avg(rows.map(s => avg(s.nilai))))}</td></tr>`;
      } else {
        render();
      }
    }, 150);
  }
});

/* ===== Mulai ===== */
if (S.sess && S.sess.exp > Date.now()) loadData(false); else { store.del(SESSION_KEY); store.del(DATA_KEY); S.sess = null; render(); }
</script>
</body>
</html>
